<script>window.__CONTENT = {"topicId": "mt_read-ancient", "title": "借助注释读古诗：把拐杖用好，再放下", "subject": "语文", "grade": 3, "template": "explain", "renderer": "poemNote", "version": "1.0.0", "steps": [{"type": "intro", "title": "每个字都认识，为什么还是读不懂？", "lead": "「停车坐爱枫林晚」——七个字，三年级的你个个认识。可「坐」在这里不是坐下，是「因为」。<br><br>古诗难，常常不难在生字，难在这种<b>看着认识、其实用错了意思</b>的字。注释就是为它们准备的。今天学一件事：把注释送回它该在的位置，然后撤掉注释，自己说一遍。", "bullets": [{"text": "<b>三步：</b>先猜「坐」是什么意思；再把六条注释送回诗句；最后撤掉注释复述一句"}, {"text": "注释是拐杖。会用的人走得稳，用久了要放下——考试可不给注释"}]}, {"type": "choice", "title": "「停车坐爱枫林晚」的「坐」", "question": "先别看注释。你猜这个「坐」是什么意思？点一个，看看三种可能各会推出什么。", "options": ["坐下来——停下车，坐下来欣赏枫林", "因为——停下车，是因为喜爱这傍晚的枫林", "座位——停车的座位"], "answer": "因为——停下车，是因为喜爱这傍晚的枫林", "soft": true, "misconception": {"坐下来——停下车，坐下来欣赏枫林": "按这个意思，诗该写「停车坐看枫林晚」。可后面跟的是「爱」——「坐爱」连在一起，坐下就说不通了。意思不对，语法先会露馅。", "因为——停下车，是因为喜爱这傍晚的枫林": "对了。古汉语里「坐」常作「因为」讲。整句变成：停下车，是因为喜爱傍晚的枫林——因果关系一出来，人才显得舍不得走。", "座位——停车的座位": "「座位」是名词，可它后面紧跟着「爱」，名词没法直接带「爱」。先看这个词在句里干什么活，再定它的意思。"}}, {"type": "poemNote", "title": "把六条注释送回诗句", "ask": "先点一张注释卡，再点它解释的那一句诗。放对了，卡片会贴到那一句旁边。", "body": {"poemTitle": "山行", "by": "唐 · 杜牧", "lines": ["远上寒山石径斜，", "白云生处有人家。", "停车坐爱枫林晚，", "霜叶红于二月花。"], "notes": [{"text": "寒山：深秋时节的山。", "on": 0, "tag": "寒山", "after": "深秋的山是冷的、秃的，所以下一句的「霜」才不突然。"}, {"text": "石径：石头铺成的小路。", "on": 0, "tag": "石径", "after": "石头小路斜着往上——一个「斜」字，山路的样子就出来了。"}, {"text": "生处：形成、飘浮的地方。", "on": 1, "tag": "生处", "after": "不是「产生」的书面语，是白云正在那儿冒着、浮着。"}, {"text": "坐：因为。", "on": 2, "tag": "坐=因为", "after": "这个字一改，整句就通了：停车，是因为喜爱傍晚的枫林。"}, {"text": "霜叶：经霜打过的枫叶。", "on": 3, "tag": "霜叶", "after": "打过霜的叶子才红得透。不是所有红叶都叫霜叶。"}, {"text": "红于：比……更红。", "on": 3, "tag": "红于", "after": "「于」在这里是比较，不是「在」。霜叶比二月的花还红——这是全诗最狠的一句夸奖。"}], "cardLabel": "注释卡（顺序打乱了）", "idle": "先点一张注释卡，再点它解释的那一句诗。", "okOne": "对上了。", "allOk": "六条注释都归位了。现在把注释撤掉——你还能说清第三句吗？", "recall": {"hint": "不看注释，点词块把「停车坐爱枫林晚」说成自己的话", "answer": ["停下车", "因为", "喜爱", "傍晚的枫林"], "words": ["停下车", "因为", "喜爱", "傍晚的枫林", "忽然", "害怕"], "done": "说清了。注意你刚才做的一切：先猜、再查、再撤掉注释自己说——这三步就是读古诗的正路。"}}, "note": "最容易漏的：查了「坐＝因为」，却没放回句子里读一遍。注释不落地，等于没查。", "warn": true}, {"type": "annotate", "title": "诗里的景，是一层一层往上走的", "ask": "用 ○ 标出诗里「看得见的东西」，用 ～ 标出你觉得最美的那一句。标够 3 处就能往下走。", "body": {"text": "远上寒山石径斜，\n白云生处有人家。\n停车坐爱枫林晚，\n霜叶红于二月花。", "symbols": [{"k": "○", "name": "看得见的景", "hint": "山、路、云、人家、枫林、叶子"}, {"k": "～", "name": "最美的一句", "hint": "读完最想再看一遍的那句"}, {"k": "？", "name": "还不懂", "hint": "注释里也没说清的"}], "symLabel": "先选符号，再点诗句里的词：", "idle": "景是有顺序的：脚下的小路、远处的白云、傍晚的枫林——诗人的眼睛一直在动。", "min": 3, "marks": [{"t": "寒山", "sym": "○", "why": "第一眼是山，而且是深秋的山——冷、远、颜色暗。"}, {"t": "石径", "sym": "○", "why": "第二眼落到脚下：一条石头小路斜着往上。视线从远收到近。"}, {"t": "白云生处", "sym": "○", "why": "第三眼抬高：云在冒，人家在云里。这一句把画面推到了最远处。"}, {"t": "人家", "sym": "○", "why": "山里有房子，就有人。冷冷的一座山，忽然有了烟火气。"}, {"t": "枫林晚", "sym": "～", "why": "「晚」不只是时间，是光线最好的那一刻——夕阳打在红叶上，才红得发亮。"}, {"t": "霜叶红于二月花", "sym": "～", "why": "春天最红的是花，可他说霜叶比花还红。这一比，全诗的分量都压在这一句上。"}], "after": "看这首诗的顺序：<b>远山 → 小路 → 白云 → 人家 → 枫林 → 叶子</b>。镜头一路拉近，最后停在一片叶子上。<br>写景的作文也是这么写的：先定一个顺序，别东一句西一句。", "revealLabel": "看看还有哪几处写景"}}, {"type": "draft", "title": "把整首诗讲给一个没读过的人", "ask": "三行就够：一行写你看到的景，一行写诗人做了什么，一行写你最想说的那一句。不许用「很美」「很漂亮」。", "body": {"rows": 3, "minChars": 30, "rowHints": ["我顺着石头小路上山，看见……", "诗人停下车，因为……", "我最想说的是……"], "chips": ["顺着", "远远地", "因为", "比……还"], "chipTip": "卡住了点一个起头：", "sample": "我顺着一条斜斜的石头小路上山，抬头看见白云正在冒出来的地方有几户人家。诗人把车停下来，不是因为累，是因为傍晚的枫林太好看了。我最想说的是最后一句：打过霜的叶子，比二月的花还要红。", "sampleNote": "它没有用「很美」。它做的是把每一句换成自己看见的画面——这就是「说清」。", "sampleLabel": "写完再看别人怎么写", "done": "写完了。你现在能不用注释讲这首诗——拐杖放下了。"}}, {"type": "rubric", "title": "给自己看看：读懂了几分", "lead": "三个维度，每维选一级。<b>不打分</b>，选完告诉你下一步只改哪一处。", "body": {"descIdle": "选一级，看看它要求什么", "dimensions": [{"name": "字词落地", "levels": [{"k": "照抄注释", "d": "说的是「坐：因为」，但没放回句子里讲一遍。"}, {"k": "放回句中", "d": "能说出「停车坐爱枫林晚」整句的意思。"}, {"k": "说得通全诗", "d": "知道「霜叶」「红于」之后，能说清最后一句为什么是在夸叶子。"}]}, {"name": "看见画面", "levels": [{"k": "只有词", "d": "列出了山、路、云、叶，但没连成一幅画。"}, {"k": "有顺序", "d": "能说清视线是从远到近，还是从下往上。"}, {"k": "有光线", "d": "注意到「晚」「霜」这些让人看见时间和温度的字。"}]}, {"name": "放下注释", "levels": [{"k": "还得看", "d": "讲的时候忍不住回去翻注释。"}, {"k": "能讲大意", "d": "不看注释也能说出四句大概讲了什么。"}, {"k": "能讲好处", "d": "还能说出哪一句写得最好，好在哪个字。"}]}], "advice": "哪一维没到最高一级，只改那一处：字词没落地就把注释放回句中读一遍；看不见画面就按「远→近」说一遍；放不下注释就合上注释再讲一次。", "note": "注释是给「看着认识、其实不懂」的字准备的。查完不放下，读诗就永远隔着一层。"}}, {"type": "summary", "title": "带走三件事", "points": ["古诗的难点常常不是生字，是「坐」「于」「生处」这种看着认识、意思不对的字", "注释要送回它解释的那一句，光抄下来没用——放回句子里，意思才活", "最后一定要撤掉注释自己讲一遍。讲得出来，才算读懂"], "advice": "找一首没学过的古诗，先不看注释猜三个字的意思，再查注释对一对。猜错的那些字，就是你以后读古诗要留神的地方。下一步学「理解古诗大意」：从一句到整首。"}]};CourseEngine.mount(window.__CONTENT);</script>
