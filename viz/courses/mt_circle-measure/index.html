<script>window.__CONTENT = {"topicId": "mt_circle-measure", "title": "圆的周长与面积：π 是量出来的", "subject": "数学", "grade": 6, "template": "explain", "renderer": "circleMeasure", "version": "1.0.0", "steps": [{"type": "intro", "title": "3 倍多一点", "lead": "圆的边是弯的，怎么量它的周长？拿绳子绕一圈、或者让圆在尺子上滚一圈——你会发现一个奇怪的事：不管圆多大，周长总是直径的 3 倍多一点。这个「多一点」就是 π。", "bullets": [{"text": "<b>学完能做到：</b>通过测量得出周长总是直径的三倍多"}, {"text": "会算圆形花坛的周长和占地面积"}]}, {"type": "choice", "title": "先试试：周长和直径谁长", "question": "对一个圆来说，周长和直径哪个更长？", "options": ["周长", "直径", "一样长"], "answer": "周长", "hint": "绕圆一圈和穿圆而过，哪段路远？", "misconception": {"直径": "直径是穿圆而过的直线，只是周长的大约三分之一。", "一样长": "弯的一圈显然比直穿一圈长。"}}, {"type": "circleMeasure", "title": "滚一圈，量出 π", "body": {"mode": "perimeter"}, "caption": "圆滚一整圈，滚过的长度 ≈ 3.14 个直径，于是 C = πd = 2πr"}, {"type": "circleMeasure", "title": "切开拼成长方形", "body": {"mode": "area"}, "caption": "16 等份交错拼成长方形：长 = πr，宽 = r，所以 S = πr²"}, {"type": "text", "title": "两个公式怎么用", "paras": ["周长 <b>C = πd = 2πr</b>：给直径就用 πd，给半径就用 2πr，看题目给的是哪个。", "面积 <b>S = πr²</b>：r² 是 r×r，不是 r×2。", "π 通常取 3.14。算之前先看清是求「围一圈多长」还是「占多大地方」。"], "note": "易错：周长和面积单位不同（厘米 vs 平方厘米），别混着写；r² 是 r×r 不是 2r；圆环、半圆这类组合图形要先分清求的是哪一段。", "warn": true}, {"type": "choice", "title": "给半径求周长", "question": "一个圆的半径是 3 米，它的周长大约是多少米（π 取 3.14）？", "options": ["9.42 米", "18.84 米", "28.26 米"], "answer": "18.84 米", "hint": "给的是半径，用 C = 2πr。", "misconception": {"9.42 米": "这只算了 πr，是半个周长，忘了乘 2。", "28.26 米": "这是 πr² 的结果，那是面积不是周长。"}}, {"type": "quiz", "title": "花坛占地面积", "question": "半径 2 米的圆形花坛，占地面积约是多少平方米（π 取 3.14）？", "answer": 12.56, "why": "S = πr² = 3.14 × 2 × 2 = 12.56 平方米。"}, {"type": "summary", "title": "π 把弯的变成了直的", "points": ["周长 ÷ 直径 = π ≈ 3.14，与圆的大小无关", "C = πd = 2πr", "剪拼成长方形后 S = 长 × 宽 = πr × r = πr²"], "advice": "「化曲为直」和「化圆为方」都是转化思想——新问题变成老问题来算。"}]};CourseEngine.mount(window.__CONTENT);</script>
