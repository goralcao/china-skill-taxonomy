<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>线面角 · 学阶图谱课件</title>
<style>
:root {
--bg: #0a0f18;
--panel: #0f1620;
--card: #141d29;
--line: #24303f;
--text: #e8edf5;
--dim: #8b98ab;
--accent: #ffd166;
--ok: #4ade80;
--bad: #f87171;
--carry: #60a5fa;
--borrow: #fb923c;
--geo: #a78bfa;
--num: #38bdf8;
}
* { box-sizing: border-box; }
body {
margin: 0;
background: var(--bg);
color: var(--text);
line-height: 1.7;
font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
padding: 0 16px calc(88px + env(safe-area-inset-bottom, 0px));
-webkit-text-size-adjust: 100%;
}
header {
position: sticky;
top: 0;
z-index: 5;
background: rgba(10, 15, 24, .94);
backdrop-filter: blur(8px);
padding: 10px 0;
border-bottom: 1px solid var(--line);
display: flex;
gap: 12px;
align-items: center;
}
header .back { color: var(--dim); text-decoration: none; font-size: 13px; }
header .back:hover { color: var(--text); }
main { max-width: 720px; margin: 0 auto; padding-top: 14px; }
h1 { font-size: 21px; margin: 0 0 8px; line-height: 1.4; }
h2 { font-size: 17px; margin: 0 0 10px; line-height: 1.5; }
h1:focus, h2:focus { outline: none; }
p { margin: 0 0 10px; }
.muted { color: var(--dim); font-size: 13.5px; }
.mono { font-variant-numeric: tabular-nums; }
.card {
background: var(--panel);
border: 1px solid var(--line);
border-radius: 12px;
padding: 14px 16px;
margin: 14px 0;
}
.card.tip { border-left: 3px solid var(--accent); }
.card.pitfall { border-left: 3px solid var(--bad); }
.card.ok { border-left: 3px solid var(--ok); }
.card:last-child { margin-bottom: 0; }
.step { display: none; }
.step.active { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
footer {
position: fixed;
left: 0; right: 0; bottom: 0;
z-index: 6;
display: flex;
align-items: center;
gap: 12px;
padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
background: rgba(10, 15, 24, .96);
border-top: 1px solid var(--line);
}
footer .progress { flex: 1; font-size: 12px; color: var(--dim); }
footer .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
footer .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.btn {
padding: 11px 18px;
border-radius: 10px;
border: 1px solid var(--line);
background: var(--card);
color: var(--text);
font-size: 15px;
min-height: 44px;
cursor: pointer;
touch-action: manipulation;
font-family: inherit;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: #1a1300; border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 8px 13px; min-height: 38px; font-size: 13.5px; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="number"], input[type="text"] {
font-family: inherit;
font-size: 20px;
font-variant-numeric: tabular-nums;
padding: 10px 12px;
border-radius: 10px;
border: 1px solid var(--line);
background: var(--card);
color: var(--text);
width: 140px;
text-align: center;
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gnav {
display: flex;
align-items: center;
gap: 4px;
flex-wrap: wrap;
font-size: 12px;
line-height: 1.9;
padding: 6px 10px;
margin: 0 0 14px;
background: var(--panel);
border: 1px solid var(--line);
border-radius: 10px;
}
.gnav .gnav-label { color: var(--dim); font-size: 11.5px; padding: 0 1px; }
.gnav a {
color: #cbd5e1;
text-decoration: underline;
text-decoration-color: rgba(203, 213, 225, .3);
text-underline-offset: 3px;
padding: 1px 1px;
white-space: nowrap;
}
.gnav a:hover { color: var(--accent); text-decoration-color: var(--accent); }
.gnav a.self {
color: var(--accent);
font-weight: 600;
text-decoration: none;
border: 1px solid var(--accent);
border-radius: 6px;
padding: 1px 8px;
}
.gnav .sep { color: #3f4c5e; padding: 0 1px; }
.gnav .gnav-pair { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.extend { margin: 22px 0 8px; }
.extend h3 { font-size: 15px; margin: 0 0 10px; color: var(--text); }
.extend h3 small { font-weight: 400; color: var(--dim); font-size: 12.5px; margin-left: 6px; }
.ext-item {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 12px;
border: 1px solid var(--line);
border-radius: 10px;
background: var(--panel);
margin-bottom: 8px;
text-decoration: none;
color: var(--text);
min-height: 46px;
}
.ext-item:hover { border-color: var(--accent); }
.ext-item .who { flex: 1; min-width: 0; }
.ext-item .who b { font-weight: 600; font-size: 14px; }
.ext-item .who span { display: block; color: var(--dim); font-size: 12px; }
.ext-item .tag {
font-size: 11px;
padding: 2px 7px;
border-radius: 20px;
border: 1px solid var(--line);
color: var(--dim);
white-space: nowrap;
}
.ext-item .tag.has { border-color: var(--ok); color: var(--ok); }
.ext-note { font-size: 12.5px; color: var(--dim); margin: 2px 0 12px; }
.viz {
background: var(--panel);
border: 1px solid var(--line);
border-radius: 12px;
padding: 16px 12px;
margin: 14px 0;
display: flex;
justify-content: center;
overflow: hidden;
}
.viz svg { display: block; max-width: 100%; height: auto; touch-action: none; }
@media (min-width: 640px) {
.viz svg { max-width: 430px; margin: 0 auto; }
}
.viz-cap { text-align: center; font-size: 12.5px; color: var(--dim); margin: -6px 0 14px; }
.viz-cap b { color: var(--accent); font-weight: 600; }
.vert {
display: inline-block;
font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
font-size: 30px;
font-variant-numeric: tabular-nums;
line-height: 1.14;
color: var(--text);
user-select: none;
}
.vert .vrow { display: grid; align-items: center; justify-items: center; }
.vert .vrow > span { min-width: 1.14em; text-align: center; }
.vert .vcarry > span { font-size: .46em; font-weight: 700; color: var(--carry); height: 1.05em; }
.vert .vcarry > span.borrow { color: #fb923c; font-size: .62em; }
.vert .vop { color: var(--dim); }
.vert .vline {
height: 3px;
background: var(--text);
border-radius: 2px;
margin: 3px 0 5px;
}
.vert .vans > span { color: var(--accent); font-weight: 700; }
.vert .vans > span.hide { color: transparent; }
.vert .vrow > span.done { color: var(--ok); }
.vert .vrow > span.pending { opacity: .34; }
.vert .vdots { letter-spacing: .18em; color: var(--dim); }
.geo-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.geo-cell {
fill: transparent;
stroke: rgba(167, 139, 250, .22);
stroke-width: .8;
transition: fill .18s;
}
.geo-cell.on { fill: rgba(167, 139, 250, .52); stroke: rgba(200, 180, 255, .6); }
.geo-outline { fill: none; stroke: var(--geo); stroke-width: 2.2; }
.geo-label { fill: var(--text); font-size: 13px; font-family: inherit; }
.geo-dim { stroke: var(--num); stroke-width: 1.6; }
.geo-dim-text { fill: var(--num); font-size: 12.5px; font-family: inherit; }
.geo-piece { transition: transform .5s cubic-bezier(.4, 0, .2, 1); }
.geo-cut { stroke: var(--bad); stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
.nl-axis { stroke: var(--dim); stroke-width: 1.6; }
.nl-tick { stroke: var(--dim); stroke-width: 1.2; }
.nl-text { fill: var(--dim); font-size: 11.5px; font-family: inherit; text-anchor: middle; }
.nl-point { fill: var(--num); }
.nl-point-label { fill: var(--text); font-size: 12.5px; font-weight: 600; font-family: inherit; text-anchor: middle; }
.nl-span { fill: rgba(56, 189, 248, .22); stroke: var(--num); stroke-width: 1; }
.nl-handle { fill: var(--accent); cursor: grab; }
.nl-handle:active { cursor: grabbing; }
.cx-axis { stroke: var(--dim); stroke-width: 1.4; }
.cx-grid { stroke: var(--line); stroke-width: .8; }
.cx-text { fill: var(--dim); font-size: 11px; font-family: inherit; }
.cx-curve { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.cx-dot { fill: var(--accent); }
.cx-dot-label { fill: var(--text); font-size: 12px; font-family: inherit; }
.ck-face { fill: var(--card); stroke: var(--line); stroke-width: 2; }
.ck-tick { stroke: var(--dim); stroke-width: 1.4; }
.ck-tick.major { stroke: var(--text); stroke-width: 2.4; }
.ck-num { fill: var(--dim); font-size: 13px; font-family: inherit; text-anchor: middle; dominant-baseline: middle; }
.ck-hand { stroke-linecap: round; }
.ck-hand.hour { stroke: var(--text); stroke-width: 5; }
.ck-hand.minute { stroke: var(--num); stroke-width: 3.4; }
.ck-hand.second { stroke: var(--bad); stroke-width: 1.6; }
.ck-hand.dim { opacity: .28; }
.ck-center { fill: var(--accent); }
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.quiz-q { font-size: 16.5px; margin: 16px 0 4px; line-height: 1.65; }
.quiz-q b { color: var(--accent); }
.answer-row {
display: flex; gap: 10px; align-items: center; justify-content: center;
margin: 14px 0 4px; flex-wrap: wrap;
}
.answer-row .unit { color: var(--dim); font-size: 14px; }
.options { display: grid; gap: 10px; margin: 14px 0; }
.opt {
padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
background: var(--card); color: var(--text); font-size: 16px; text-align: left;
min-height: 52px; cursor: pointer; font-family: inherit; touch-action: manipulation;
}
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: rgba(74, 222, 128, .12); }
.opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, .12); }
.score { font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.score small { font-size: 15px; color: var(--dim); font-weight: 400; }
.demo {
display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
margin: 4px 0 14px;
}
.demo .btn { flex: 0 0 auto; }
.demo-tip {
flex: 1 1 100%;
margin: 2px 0 0;
font-size: 13.5px;
line-height: 1.7;
color: var(--text);
background: var(--panel);
border: 1px solid var(--line);
border-left: 3px solid var(--accent);
border-radius: 10px;
padding: 10px 12px;
min-height: 44px;
}
.demo-tip b { color: var(--accent); }
.demo-tip:empty { display: none; }
.solid-svg, .pyr-svg, .mol-svg, .cal-svg, .dec-svg, .tbl-svg, .cmp-svg, .law-svg, .tri-svg,
.cnt-svg, .ang-svg, .qd-svg, .dgr-svg, .m2-svg, .fm-svg, .fop-svg, .frd-svg, .spn-svg, .dcm-svg, .dcd-svg, .vol-svg, .prs-svg, .tre-svg, .sym-svg, .cht-svg, .men-svg, .ply-svg, .fac-svg, .fdv-svg, .bal-svg, .ctt-svg, .cir-svg, .cim-svg, .sec-svg, .cyl-svg { width: 100%; height: auto; touch-action: none; }
.solid-svg, .pyr-svg { cursor: grab; }
.solid-svg:active, .pyr-svg:active { cursor: grabbing; }
.viz text { fill: var(--text); font-family: inherit; }
.viz .dnum { font-size: 20px; font-weight: 600; }
.viz .dsmall { font-size: 13px; fill: var(--dim); }
.viz .dbar { stroke: var(--text); stroke-width: 2; fill: none; }
.viz .dunder { stroke: var(--dim); stroke-width: 1.5; }
.fm { text-align: center; }
.fm-ctl {
display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
margin: 2px 0 8px; font-size: 13.5px; color: var(--dim);
}
.fm-ctl input[type="range"] { width: 140px; accent-color: var(--accent); }
.fm-ctl b { color: var(--accent); font-size: 14px; }
@keyframes sbShake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-4px); }
75% { transform: translateX(4px); }
}
.shake { animation: sbShake .4s ease; }
.sb-wrap { width: 100%; max-width: 520px; }
.sb-sent {
font-size: 19px; line-height: 2.1; text-align: center; padding: 14px 10px;
background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 64px;
}
.sb-sent .sb-add {
color: var(--accent); font-weight: 600; background: rgba(255, 209, 102, .12);
border-radius: 4px; padding: 0 3px;
}
.sb-ask { text-align: center; font-size: 13px; color: var(--dim); margin: 12px 0 8px; }
.sb-ask b { color: var(--accent); }
.sb-opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sb-opt, .tf-opt, .pp-opt {
background: var(--card); border: 1px solid var(--line); color: var(--text);
border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit;
}
.sb-opt:hover, .tf-opt:hover, .pp-opt:hover { border-color: var(--accent); }
.sb-stat { text-align: center; font-size: 12px; color: var(--dim); margin-top: 10px; }
.sb-stat b { color: var(--text); }
.sb-msg, .pm-msg, .tf-msg, .pp-msg {
text-align: center; font-size: 13px; color: var(--dim); margin-top: 10px; min-height: 20px;
}
.sb-msg.ok, .pm-msg.ok, .tf-msg.ok, .pp-msg.ok { color: var(--ok); }
.sb-msg.bad, .pm-msg.bad, .tf-msg.bad, .pp-msg.bad { color: var(--bad); }
.pm-wrap { width: 100%; max-width: 580px; }
.pm-head {
display: grid; grid-template-columns: 1fr 96px 1fr; gap: 8px;
font-size: 12px; color: var(--dim); text-align: center; margin-bottom: 6px;
}
.pm-body { display: grid; grid-template-columns: 1fr 96px 1fr; gap: 8px; align-items: start; }
.pm-col, .pm-mid { display: flex; flex-direction: column; gap: 8px; }
.pm-card {
background: var(--card); border: 1px solid var(--line); color: var(--text);
border-radius: 9px; padding: 9px 12px; font-size: 13.5px; cursor: pointer;
font-family: inherit; text-align: left; line-height: 1.6;
}
.pm-card:hover { border-color: var(--accent); }
.pm-card.sel { border-color: var(--accent); color: var(--accent); }
.pm-card.done { border-color: var(--ok); color: var(--ok); opacity: .85; cursor: default; }
.pm-word {
font-size: 12px; color: var(--dim); text-align: center; min-height: 40px;
display: flex; align-items: center; justify-content: center;
}
.pm-word.on { color: var(--accent); font-weight: 600; }
.tf-wrap { width: 100%; max-width: 540px; }
.tf-lab { font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
.tf-src, .tf-out {
font-size: 16px; line-height: 2; padding: 12px 14px; border-radius: 10px;
background: var(--card); border: 1px solid var(--line);
}
.tf-src .tf-hot { color: var(--bad); font-weight: 600; background: rgba(248, 113, 113, .14); border-radius: 4px; padding: 0 3px; }
.tf-out .tf-new { color: var(--ok); font-weight: 600; background: rgba(74, 222, 128, .12); border-radius: 4px; padding: 0 3px; }
.tf-out .tf-dim { color: var(--dim); }
.tf-ask { font-size: 13px; color: var(--dim); text-align: center; margin: 12px 0 8px; }
.tf-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pp-wrap { width: 100%; max-width: 520px; }
.pp-line {
font-size: 17px; line-height: 2.2; text-align: center; padding: 14px 10px;
background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 62px;
}
.pp-slot {
display: inline-block; min-width: 30px; padding: 0 4px; margin: 0 2px;
border-bottom: 2px solid var(--dim); color: var(--dim); text-align: center;
}
.pp-slot.ok { border-bottom-color: var(--ok); color: var(--ok); font-weight: 700; }
.pp-slot.bad { border-bottom-color: var(--bad); color: var(--bad); }
.pp-opts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
.pp-opt { font-size: 18px; min-width: 52px; text-align: center; }
.pp-bar { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.pp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
.pp-dot.ok { background: var(--ok); }
.pp-dot.no { background: var(--bad); }
@media (max-width: 480px) {
.pm-head, .pm-body { grid-template-columns: 1fr 74px 1fr; }
.pm-card { font-size: 12.5px; padding: 8px 10px; }
.sb-sent, .pp-line { font-size: 17px; }
}
.an-text {
font-size: 18px; line-height: 2.4; padding: 16px 14px; border-radius: 10px;
background: var(--card); border: 1px solid var(--line); letter-spacing: .3px;
}
.an-tok {
display: inline; background: none; border: 0; border-bottom: 2px dashed var(--dim);
color: inherit; font: inherit; line-height: inherit; cursor: pointer;
padding: 0 1px; margin: 0 1px;
}
.an-tok:focus { outline: none; }
.an-tok:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.an-tok:hover { color: var(--accent); border-bottom-color: var(--accent); }
.an-tok.hit {
color: var(--accent); font-weight: 600; background: rgba(255, 209, 102, .14);
border-bottom: 2px solid var(--accent); border-radius: 4px;
}
.an-stat { font-size: 13px; color: var(--dim); margin-top: 10px; }
.an-stat b { color: var(--text); font-size: 15px; }
.an-stat.ok b { color: var(--ok); }
.an-why { font-size: 13.5px; color: var(--dim); margin-top: 6px; min-height: 20px; line-height: 1.8; }
.an-why b { color: var(--text); }
.an-after {
margin-top: 10px; padding: 12px 14px; border-radius: 9px;
background: rgba(255, 209, 102, .07); border: 1px dashed rgba(255, 209, 102, .35);
font-size: 13.5px; line-height: 1.9; color: var(--dim);
}
.an-after b { color: var(--accent); }
.dr-wrap { width: 100%; max-width: 560px; }
.dr-input {
width: 100%; box-sizing: border-box; display: block; margin-bottom: 8px;
background: var(--card); border: 1px solid var(--line); border-radius: 9px;
color: var(--text); font: inherit; font-size: 16px; line-height: 2; padding: 10px 12px;
resize: vertical; min-height: 62px;
}
.dr-input:focus { outline: none; border-color: var(--accent); }
.dr-input::placeholder { color: var(--dim); opacity: .7; }
.dr-tip { font-size: 12px; color: var(--dim); margin: 4px 0 6px; }
.dr-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.dr-chip {
background: rgba(255, 209, 102, .08); border: 1px dashed rgba(255, 209, 102, .4);
color: var(--accent); border-radius: 999px; padding: 4px 11px; font-size: 12.5px;
font-family: inherit; cursor: pointer;
}
.dr-chip:hover { background: rgba(255, 209, 102, .16); }
.dr-meta { font-size: 12px; color: var(--dim); margin: 2px 0 10px; }
.dr-meta b { color: var(--text); }
.dr-meta.ok b { color: var(--ok); }
.dr-bar { display: flex; flex-wrap: wrap; gap: 8px; }
.dr-sample {
margin-top: 12px; padding: 12px 14px; border-radius: 9px;
background: rgba(255, 255, 255, .03); border: 1px solid var(--line);
font-size: 14.5px; line-height: 2;
}
.dr-sample-head { font-size: 11.5px; color: var(--dim); letter-spacing: .5px; margin-bottom: 4px; }
.dr-sample p { margin: 0; }
.rb-wrap { width: 100%; max-width: 620px; }
.rb-row {
padding: 12px 0; border-bottom: 1px solid var(--line);
display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; align-items: center;
}
.rb-row:last-child { border-bottom: 0; }
.rb-name { font-size: 14px; font-weight: 600; color: var(--text); }
.rb-opts { display: flex; gap: 6px; }
.rb-opt {
background: var(--card); border: 1px solid var(--line); color: var(--dim);
border-radius: 7px; padding: 5px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
}
.rb-opt:hover { border-color: var(--accent); color: var(--accent); }
.rb-opt.on { border-color: var(--accent); background: rgba(255, 209, 102, .12); color: var(--accent); font-weight: 600; }
.rb-desc { grid-column: 2; font-size: 12.5px; color: var(--dim); min-height: 18px; line-height: 1.8; }
.rb-desc.on { color: var(--text); }
.rb-result { margin-top: 12px; font-size: 13px; color: var(--dim); min-height: 22px; }
.rb-result.on { padding: 12px 14px; border-radius: 9px; background: rgba(74, 222, 128, .08); color: var(--text); }
.self-recap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.self-recap span {
font-size: 12px; color: var(--accent); border: 1px solid rgba(255, 209, 102, .35);
border-radius: 999px; padding: 3px 10px;
}
.draft-recap {
margin-top: 12px; padding: 12px 14px; border-radius: 9px;

.rb-row { grid-template-columns: 72px 1fr; }

<script>window.__CONTENT = {"topicId": "mt_mat-s-space-vector-application", "title": "空间角：线面角与二面角", "subject": "数学", "grade": 11, "template": "explain", "renderer": "pyramid", "version": "1.0.0", "steps": [{"type": "intro", "title": "侧棱和底面成多少度？别猜 45°", "lead": "正四棱锥看起来四平八稳，但侧棱的倾斜程度不是看出来的，是算出来的。", "bullets": [{"text": "<b>线面角</b>：斜线和它在平面内的射影所成的角。"}, {"text": "<b>关键一步</b>：把顶点往底面投影，射影就出现了。"}, {"text": "<b>常见错</b>：把侧棱和底边的夹角当成线面角，那是另一个角。", "warn": true}]}, {"type": "pyramid", "title": "把射影画出来", "body": {"a": 2, "h": 2}, "caption": "底面边长 2，高 2。P 在底面的射影是中心 O。", "demoLabel": "▶ 一步一步找角", "demoHint": "点一次多一条线：先看侧棱，再作射影，最后标出夹角。也可以拖着转一圈。", "demoDone": "找到了"}, {"type": "text", "title": "找线面角，永远是三步", "paras": ["一、在斜线上取一点，向平面作垂线，垂足就是射影的端点；二、连射影，得到直角三角形；三、在这个三角形里算角。", "本题中 PO ⊥ 底面，所以 BO 就是 PB 的射影，∠PBO 就是所求的角。"], "note": "tan∠PBO = PO ÷ BO。高 PO = 2，BO 是底面中心到顶点的距离，等于对角线的一半。"}, {"type": "quiz", "title": "算一算这个角", "question": "底面边长 2、高 2 的正四棱锥，侧棱与底面所成角约是多少度？（保留一位小数）", "answer": 54.7, "unit": "度", "why": "BO = 2÷√2 ≈ 1.414，tanθ = 2÷1.414 ≈ 1.414，θ ≈ 54.7°，不是 45°。"}, {"type": "choice", "title": "线面角的范围", "question": "一条直线与一个平面所成的角 θ，取值范围是？", "options": ["0° ≤ θ ≤ 90°", "0° ≤ θ ≤ 180°", "0° ≤ θ < 360°"], "answer": "0° ≤ θ ≤ 90°", "hint": "直线在平面内或平行时是 0°，垂直时是 90°，不会更大了。", "misconception": {"0° ≤ θ ≤ 180°": "180° 是两条直线的夹角范围，线面角最大到 90°。", "0° ≤ θ < 360°": "把线面角当成了旋转角，转一周是 360°。"}}, {"type": "text", "title": "用向量算，更快", "paras": ["设平面的法向量为 n，直线的方向向量为 l，则 sinθ = |n·l| ÷ (|n||l|)。", "注意是正弦，不是余弦——向量夹角算出来的是法向量与直线的夹角，它和线面角互余。"], "note": "记住这句：<b>线面角用正弦，二面角用余弦的绝对值</b>。"}, {"type": "pyramid", "title": "二面角：两个面之间的角", "body": {"a": 2, "h": 2, "focus": "dihedral"}, "caption": "侧面 PBC 与底面 ABCD 相交于棱 BC，二面角就长在这条棱上。", "demoLabel": "▶ 找二面角", "demoHint": "点一次多一条线：先找棱，再在两个面内各作一条垂线，最后标出夹角。", "demoDone": "找到了", "note": "两条垂线都必须<b>垂直于棱</b>，随便在面上画一条线量出来的不是二面角。"}, {"type": "quiz", "title": "算一算二面角", "question": "底边 2、高 2 的正四棱锥，侧面与底面所成二面角约是多少度？（保留一位小数）", "answer": 63.4, "unit": "度", "why": "MP = √(2² + 1²) = √5，MO = 1，cosθ = 1/√5 ≈ 0.447，θ ≈ 63.4°。"}, {"type": "summary", "title": "记住这三句", "points": ["线面角 = 斜线与射影的夹角，最大 90°", "二面角 = 垂直于棱的两条射线所成的角", "向量法：线面角用 sin，二面角用 |cos|"], "advice": "接着可以练「点到平面的距离」——用的还是同一个法向量，只是换了个公式。"}]};CourseEngine.mount(window.__CONTENT);</script>
