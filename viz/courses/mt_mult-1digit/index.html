<style>

background: var(--card); border: 1px solid var(--line);
}
.draft-recap b { font-size: 11.5px; color: var(--dim); font-weight: 400; letter-spacing: .5px; }
.draft-recap p { margin: 4px 0 0; font-size: 15px; line-height: 1.9; }
.opt.picked { border-color: var(--accent); color: var(--accent); background: rgba(255, 209, 102, .1); }
@media (max-width: 480px) {
.an-text { font-size: 16.5px; line-height: 2.3; padding: 12px 12px; }
.rb-row { grid-template-columns: 72px 1fr; }
.rb-opt { padding: 5px 9px; font-size: 12.5px; }
.dr-input { font-size: 16px; }
}
