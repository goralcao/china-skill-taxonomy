<script>window.__CONTENT = {"topicId": "mt_frac-meaning", "title": "分数的意义", "subject": "数学", "grade": 5, "template": "explain", "renderer": "fracMeaning", "version": "1.0.0", "steps": [{"type": "intro", "title": "切 4 块，每块都是四分之一吗？", "lead": "两块一样大的饼，都被切成了 4 块。可切法不一样，左边 1 块能叫 1/4，右边 1 块却不能——差别在哪？", "bullets": [{"text": "分数必须建立在「平均分」之上。"}, {"text": "单位「1」可以是一个物体，也可以是一些物体的整体。"}, {"text": "被除数 ÷ 除数 = 被除数/除数。"}]}, {"type": "fracMeaning", "title": "① 为什么一定要平均分", "body": {"mode": "compare"}, "caption": "左边平均分成 4 份，右边只是随便切成 4 块。", "demoHint": "点按钮，一块一块看过去。", "note": "不平均分，就不能用分数表示——这是判断一个图能不能用分数表示的第一条标准。"}, {"type": "fracMeaning", "title": "② 动手分一分", "body": {"mode": "parts", "n": 4, "m": 3}, "caption": "拖动滑块改份数，在图上按住拖动涂色——涂几份就是几分之几。", "demoHint": "先点按钮看演示，之后可以自己拖着涂。", "note": "把整体平均分成 4 份，每份是它的 1/4；1/4 就是它的分数单位，3/4 就是 3 个 1/4。"}, {"type": "fracMeaning", "title": "③ 单位「1」可以是一盒苹果", "body": {"mode": "group", "total": 4}, "caption": "一盒苹果平均分成 4 份，取 3 份。换盒子大小再看一次。", "demoHint": "点按钮，换三种盒子看 3/4 各是多少个。", "note": "平均分成 4 份，每份是这盒的 1/4；取 3 份就是这盒的 3/4。"}, {"type": "fracMeaning", "title": "④ 分数与除法", "body": {"mode": "divide"}, "caption": "3 个饼平均分给 4 人，每人 3/4 个。", "demoHint": "点按钮，看 3 ÷ 4 怎么等于 3/4。", "note": "每人拿到 3 个 1/4，合起来就是 3/4 个饼——3 ÷ 4 = 3/4。"}, {"type": "text", "title": "三句要记牢", "paras": ["整体平均分成若干份，这样的一份或几份可以用分数表示。", "把单位「1」平均分成 n 份，每份是 1/n（分数单位）；取 m 份就是 m/n。", "单位「1」可以是一个物体，也可以是一些物体组成的整体；a ÷ b = a/b（b 不为 0）。"], "note": "易错：分数表示的是部分与整体的关系，不是固定的数量——一盒 4 个的 3/4 是 3 个，一盒 12 个的 3/4 是 9 个，别只看分子分母。", "warn": true}, {"type": "choice", "title": "一盒 12 个，取 1/4", "question": "一盒 12 个苹果，取它的 1/4，是几个？", "options": ["3 个", "4 个", "12 个"], "answer": "3 个", "hint": "平均分成 4 份，每份 12÷4=3 个，取 1 份就是 3 个。", "misconception": {"4 个": "4 个是平均分成 3 份的结果，不是 1/4。", "12 个": "12 个是整盒，是 4/4 而不是 1/4。"}}, {"type": "quiz", "title": "平均分成 4 份取 3 份", "question": "把 8 个苹果平均分成 4 份，取其中 3 份，是多少个？", "answer": 6, "unit": "个", "why": "每份 8÷4=2 个，取 3 份是 2×3=6 个，也就是 8 的 3/4。"}, {"type": "summary", "title": "三条记住了", "points": ["分数建立在平均分之上", "分数单位是 1/n，m/n 就是 m 个 1/n", "单位「1」可大可小；a ÷ b = a/b"], "advice": "下一步学「分数与除法」，就能把 3÷4=3/4 反过来用，并认识真分数与假分数。"}]};CourseEngine.mount(window.__CONTENT);</script>
