<script>window.__CONTENT = {"topicId": "mt_sent-extend", "title": "扩句：把「小鸟飞」写成一句话", "subject": "语文", "grade": 3, "template": "explain", "renderer": "sentBuild", "version": "2.0.0", "steps": [{"type": "intro", "title": "三个字和十四个字，差在哪？", "lead": "「小鸟飞」三个字，读的人只知道有只鸟在飞；「一只可爱的小鸟，在树枝上快活地飞」——样子、地方、心情都出来了。今天不背规则，就做一件事：把一句干巴巴的话，写成一句能看见画面的话。", "bullets": [{"text": "<b>你会做三件事：</b>在原文里找出「写出样子、地方、心情」的词；自己写三句，一句比一句具体；对着三条标准给自己打分"}, {"text": "不要求写得漂亮，只要求写得让人看得见"}]}, {"type": "choice", "title": "哪一句让你看见了画面", "question": "读这两句，点一句你「看见了」的。点哪句都能看解释，没有标准答案。", "options": ["小鸟飞。", "一只可爱的小鸟，在树枝上快活地飞。", "两句差不多"], "answer": "一只可爱的小鸟，在树枝上快活地飞。", "soft": true, "misconception": {"小鸟飞。": "这句只说了「谁、做什么」。你能想出这只鸟多大、什么颜色、在哪儿吗？想不出，就是画面没给够。", "一只可爱的小鸟，在树枝上快活地飞。": "多了三样东西：样子（可爱的）、地方（树枝上）、心情（快活地）。画面就是被这三样撑起来的。", "两句差不多": "两句说的是同一件事，但给读者的信息差了三样。差别不在长短，在「读者能不能想出样子」。"}}, {"type": "annotate", "title": "找出撑起画面的三个词", "ask": "下面这句话里，有三个词分别写出了<b>样子</b>、<b>地方</b>、<b>心情</b>。点出来。", "body": {"text": "一只可爱的小鸟，在树枝上快活地飞。", "idle": "点你认为是修饰语的词，点错也没关系。", "min": 3, "marks": [{"t": "可爱", "why": "写在「小鸟」前面，回答「什么样的」——这是样子。"}, {"t": "树枝上", "why": "写在「飞」前面，回答「在哪儿」——这是地方。"}, {"t": "快活", "why": "写在「飞」前面，回答「怎样地」——这是心情，也是飞的样子。"}], "after": "剩下的「一只」写数量，「小鸟」是主角，「飞」是动作——这三样是句子的<b>骨架</b>，不是修饰语。扩句只往骨架上加肉，不换骨头。", "revealLabel": "看看还剩哪几处没被注意到"}, "note": "别把「骨架」当修饰语：「一只可爱的小鸟」里的「一只」是数量，去掉它句子照样成立；去掉「可爱」，画面就少一样。"}, {"type": "sentBuild", "title": "加在哪儿：贴着它修饰的词", "caption": "每加一层，先想清楚这一层回答的是哪个问题", "body": {"core": "小鸟飞", "tip": "点一个词，把它加进句子里", "done": "三处都加上了：样子、地方、心情。位置对了，句子才不别扭。", "slots": [{"ask": "什么样的", "at": 0, "options": ["可爱的", "飞得高的", "一只鸟"], "answer": "可爱的", "why": "加在「小鸟」前面，写出样子", "hint": "这一层要回答的是「什么样的小鸟」，不是「飞得怎么样」。"}, {"ask": "在哪里", "at": 2, "options": ["在树枝上", "很可爱", "明天"], "answer": "在树枝上", "why": "加在「飞」前面，说清地方", "hint": "这一层要回答的是「在哪儿飞」。"}, {"ask": "怎样地", "at": 2, "options": ["快活地", "可爱地", "树枝上"], "answer": "快活地", "why": "加在「飞」前面，写出飞的样子", "hint": "这一层说的是「怎么飞」。"}]}, "demo": false, "note": "位置有讲究：写「什么样的」贴着名词，用「的」；写「怎样地」贴着动词，用「地」。位置
