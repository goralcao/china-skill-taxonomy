<script>window.__CONTENT = {"topicId": "mt_circle", "title": "圆的认识：一根绳子转一圈", "subject": "数学", "grade": 6, "template": "explain", "renderer": "circle", "version": "1.0.0", "steps": [{"type": "intro", "title": "为什么井盖是圆的", "lead": "井盖、车轮、钟面——到处都是圆。圆不像长方形那样能用几根线段量出来，它是一条弯的、首尾相接的线。这节课先把圆「造」出来：一根钉住的绳子转一圈——圆心、半径、直径各管什么？", "bullets": [{"text": "<b>学完能做到：</b>用圆规画出指定半径的圆"}, {"text": "说清同一个圆里直径是半径的两倍"}]}, {"type": "choice", "title": "先试试：谁是用曲线围成的", "question": "长方形、正方形、圆——哪一个是由曲线围成的？", "options": ["长方形", "正方形", "圆"], "answer": "圆", "hint": "想想哪个图形的边是弯的。", "misconception": {"长方形": "长方形的四条边都是线段，是直的。", "正方形": "正方形的四条边也都是线段。"}}, {"type": "circle", "title": "圆心、半径、直径", "body": {}, "caption": "圆心 O 定位置，半径 r 定大小，直径 d = 2r"}, {"type": "text", "title": "用圆规画圆", "paras": ["圆规两脚张开的距离就是<b>半径</b>——先量好，再落针。", "针尖那一只脚扎下去不动，它就是<b>圆心</b>；另一只脚带铅笔绕一圈，笔尖走过的地方就是圆。", "画的时候两脚距离不能变：一变，半径就变了，画出来就不是圆。"], "note": "易错：直径必须「通过圆心」且「两端都在圆上」——只满足一条的不算直径。另外「半径都相等」是有前提的：<b>在同一个圆（或等圆）里</b>才成立。", "warn": true}, {"type": "choice", "title": "谁决定大小", "question": "两个圆大小不一样，是因为什么不同？", "options": ["圆心不同", "半径不同", "画的方向不同"], "answer": "半径不同", "hint": "想想圆心是管什么的。", "misconception": {"圆心不同": "圆心只决定圆画在纸上的位置，不改变大小。", "画的方向不同": "画的方向和圆的大小、形状都没有关系。"}}, {"type": "quiz", "title": "半径与直径", "question": "一个圆的直径是 8 厘米，它的半径是几厘米？", "answer": 4, "why": "同一个圆里 d = 2r，所以 r = d ÷ 2 = 8 ÷ 2 = 4 厘米。"}, {"type": "summary", "title": "两个量管住一个圆", "points": ["圆心 O 决定位置，半径 r 决定大小", "d = 2r，r = d ÷ 2（同圆或等圆内）", "圆是轴对称图形，有无数条对称轴"], "advice": "记住圆心和半径这两个量，下面算周长、算面积都靠它们。"}]};CourseEngine.mount(window.__CONTENT);</script>
