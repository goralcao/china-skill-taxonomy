<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万以内的加减法 · 学阶图谱课件</title>
<style>
/* 学阶图谱课件 · 共享样式
 * 源文件引用 templates/base.css（相对路径 ../../templates/），
 * 构建时整段内联进单文件产物，见 scripts/build.py 的 sync_courses_to_viz。
 */

:root {
  --bg: #0a0f18;
  --panel: #0f1620;
  --card: #141d29;
  --line: #24303f;
  --text: #e8edf5;
  --dim: #8b98ab;
  --accent: #ffd166;
  --ok: #4ade80;
  --bad: #f87171;
  --carry: #60a5fa;
  --borrow: #fb923c;
  --geo: #a78bfa;
  --num: #38bdf8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  padding: 0 16px calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(10, 15, 24, .94);
  backdrop-filter: blur(8px);
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
}

header .back { color: var(--dim); text-decoration: none; font-size: 13px; }
header .back:hover { color: var(--text); }

main { max-width: 720px; margin: 0 auto; padding-top: 14px; }

h1 { font-size: 21px; margin: 0 0 8px; line-height: 1.4; }
h2 { font-size: 17px; margin: 0 0 10px; line-height: 1.5; }
h1:focus, h2:focus { outline: none; }
p { margin: 0 0 10px; }

.muted { color: var(--dim); font-size: 13.5px; }
.mono { font-variant-numeric: tabular-nums; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 14px 0;
}
.card.tip { border-left: 3px solid var(--accent); }
.card.pitfall { border-left: 3px solid var(--bad); }
.card.ok { border-left: 3px solid var(--ok); }
.card:last-child { margin-bottom: 0; }

/* 步骤 */
.step { display: none; }
.step.active { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 底部导航 */
footer {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(10, 15, 24, .96);
  border-top: 1px solid var(--line);
}
footer .progress { flex: 1; font-size: 12px; color: var(--dim); }
footer .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
footer .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.btn {
  padding: 11px 18px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  min-height: 44px;
  cursor: pointer;
  touch-action: manipulation;
  font-family: inherit;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: #1a1300; border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 8px 13px; min-height: 38px; font-size: 13.5px; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="number"], input[type="text"] {
  font-family: inherit;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  width: 140px;
  text-align: center;
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ── 图谱位置条 ───────────────────────────────────────── */
.gnav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: 12px;
  line-height: 1.9;
  padding: 6px 10px;
  margin: 0 0 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.gnav .gnav-label { color: var(--dim); font-size: 11.5px; padding: 0 1px; }
.gnav a {
  color: #cbd5e1;
  text-decoration: underline;
  text-decoration-color: rgba(203, 213, 225, .3);
  text-underline-offset: 3px;
  padding: 1px 1px;
  white-space: nowrap;
}
.gnav a:hover { color: var(--accent); text-decoration-color: var(--accent); }
.gnav a.self {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 1px 8px;
}
.gnav .sep { color: #3f4c5e; padding: 0 1px; }
.gnav .gnav-pair { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

/* ── 延伸区块 ─────────────────────────────────────────── */
.extend { margin: 22px 0 8px; }
.extend h3 { font-size: 15px; margin: 0 0 10px; color: var(--text); }
.extend h3 small { font-weight: 400; color: var(--dim); font-size: 12.5px; margin-left: 6px; }
.ext-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  margin-bottom: 8px;
  text-decoration: none;
  color: var(--text);
  min-height: 46px;
}
.ext-item:hover { border-color: var(--accent); }
.ext-item .who { flex: 1; min-width: 0; }
.ext-item .who b { font-weight: 600; font-size: 14px; }
.ext-item .who span { display: block; color: var(--dim); font-size: 12px; }
.ext-item .tag {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid var(--line);
  color: var(--dim);
  white-space: nowrap;
}
.ext-item .tag.has { border-color: var(--ok); color: var(--ok); }
.ext-note { font-size: 12.5px; color: var(--dim); margin: 2px 0 12px; }

/* ── 呈现器通用容器 ───────────────────────────────────── */
.viz {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 12px;
  margin: 14px 0;
  display: flex;
  justify-content: center;
  overflow: hidden;
}
.viz svg { display: block; max-width: 100%; height: auto; touch-action: none; }
@media (min-width: 640px) {
  .viz svg { max-width: 430px; margin: 0 auto; }
}

.viz-cap { text-align: center; font-size: 12.5px; color: var(--dim); margin: -6px 0 14px; }
.viz-cap b { color: var(--accent); font-weight: 600; }

/* ── 竖式 ─────────────────────────────────────────────── */
.vert {
  display: inline-block;
  font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: 30px;
  font-variant-numeric: tabular-nums;
  line-height: 1.14;
  color: var(--text);
  user-select: none;
}
.vert .vrow { display: grid; align-items: center; justify-items: center; }
.vert .vrow > span { min-width: 1.14em; text-align: center; }
.vert .vcarry > span { font-size: .46em; font-weight: 700; color: var(--carry); height: 1.05em; }
.vert .vcarry > span.borrow { color: #fb923c; font-size: .62em; }
.vert .vop { color: var(--dim); }
.vert .vline {
  height: 3px;
  background: var(--text);
  border-radius: 2px;
  margin: 3px 0 5px;
}
.vert .vans > span { color: var(--accent); font-weight: 700; }
.vert .vans > span.hide { color: transparent; }
.vert .vrow > span.done { color: var(--ok); }
.vert .vrow > span.pending { opacity: .34; }
.vert .vdots { letter-spacing: .18em; color: var(--dim); }

/* ── 几何 ─────────────────────────────────────────────── */
.geo-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.geo-cell {
  fill: transparent;
  stroke: rgba(167, 139, 250, .22);
  stroke-width: .8;
  transition: fill .18s;
}
.geo-cell.on { fill: rgba(167, 139, 250, .52); stroke: rgba(200, 180, 255, .6); }
.geo-outline { fill: none; stroke: var(--geo); stroke-width: 2.2; }
.geo-label { fill: var(--text); font-size: 13px; font-family: inherit; }
.geo-dim { stroke: var(--num); stroke-width: 1.6; }
.geo-dim-text { fill: var(--num); font-size: 12.5px; font-family: inherit; }
.geo-piece { transition: transform .5s cubic-bezier(.4, 0, .2, 1); }
.geo-cut { stroke: var(--bad); stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }

/* ── 数轴 ─────────────────────────────────────────────── */
.nl-axis { stroke: var(--dim); stroke-width: 1.6; }
.nl-tick { stroke: var(--dim); stroke-width: 1.2; }
.nl-text { fill: var(--dim); font-size: 11.5px; font-family: inherit; text-anchor: middle; }
.nl-point { fill: var(--num); }
.nl-point-label { fill: var(--text); font-size: 12.5px; font-weight: 600; font-family: inherit; text-anchor: middle; }
.nl-span { fill: rgba(56, 189, 248, .22); stroke: var(--num); stroke-width: 1; }
.nl-handle { fill: var(--accent); cursor: grab; }
.nl-handle:active { cursor: grabbing; }

/* ── 坐标系 ───────────────────────────────────────────── */
.cx-axis { stroke: var(--dim); stroke-width: 1.4; }
.cx-grid { stroke: var(--line); stroke-width: .8; }
.cx-text { fill: var(--dim); font-size: 11px; font-family: inherit; }
.cx-curve { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.cx-dot { fill: var(--accent); }
.cx-dot-label { fill: var(--text); font-size: 12px; font-family: inherit; }

/* ── 钟面 ─────────────────────────────────────────────── */
.ck-face { fill: var(--card); stroke: var(--line); stroke-width: 2; }
.ck-tick { stroke: var(--dim); stroke-width: 1.4; }
.ck-tick.major { stroke: var(--text); stroke-width: 2.4; }
.ck-num { fill: var(--dim); font-size: 13px; font-family: inherit; text-anchor: middle; dominant-baseline: middle; }
.ck-hand { stroke-linecap: round; }
.ck-hand.hour { stroke: var(--text); stroke-width: 5; }
.ck-hand.minute { stroke: var(--num); stroke-width: 3.4; }
.ck-hand.second { stroke: var(--bad); stroke-width: 1.6; }
.ck-hand.dim { opacity: .28; }
.ck-center { fill: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── 题目（引擎与手写页面共用） ─────────────────────── */
.quiz-q { font-size: 16.5px; margin: 16px 0 4px; line-height: 1.65; }
.quiz-q b { color: var(--accent); }
.answer-row {
  display: flex; gap: 10px; align-items: center; justify-content: center;
  margin: 14px 0 4px; flex-wrap: wrap;
}
.answer-row .unit { color: var(--dim); font-size: 14px; }
.options { display: grid; gap: 10px; margin: 14px 0; }
.opt {
  padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 16px; text-align: left;
  min-height: 52px; cursor: pointer; font-family: inherit; touch-action: manipulation;
}
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: rgba(74, 222, 128, .12); }
.opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, .12); }
.score { font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.score small { font-size: 15px; color: var(--dim); font-weight: 400; }

</style>

      s('line', {
        x1: cx + Math.sin(ang) * r1, y1: cy - Math.cos(ang) * r1,
        x2: cx + Math.sin(ang) * r2, y2: cy - Math.cos(ang) * r2,
        class: 'ck-tick' + (major ? ' major' : '')
      }, svg);
    }
    [12, 3, 6, 9].forEach(function (num) {
      var ang = num * 30 * Math.PI / 180;
      var t = s('text', {
        x: cx + Math.sin(ang) * (R - 26), y: cy - Math.cos(ang) * (R - 26), class: 'ck-num'
      }, svg);
      t.textContent = num;
    });

    function hand(cls, len, width, back) {
      return s('line', {
        x1: cx, y1: cy + (back || 0), x2: cx, y2: cy - len,
        class: 'ck-hand ' + cls, style: 'stroke-width:' + width
      }, svg);
    }
    var hourHand = hand('hour', R * 0.50, 5, R * 0.08);
    var minHand = hand('minute', R * 0.74, 3.2, R * 0.10);
    var secHand = hand('second', R * 0.82, 1.5, R * 0.14);
    if (spec.showSecond === false) secHand.style.display = 'none';
    s('circle', { cx: cx, cy: cy, r: 4.2, class: 'ck-center' }, svg);

    var state = { absMinutes: spec.absMinutes == null ? 8 * 60 : spec.absMinutes };

    function setAbs(absMinutes) {
      state.absMinutes = ((absMinutes % 720) + 720) % 720;
      var m = state.absMinutes;
      var hourAngle = (m / 60) * 30;
      var minAngle = (m % 60) * 6;
      var sec = spec.second || 0;
      hourHand.setAttribute('transform', 'rotate(' + hourAngle + ' ' + cx + ' ' + cy + ')');
      minHand.setAttribute('transform', 'rotate(' + minAngle + ' ' + cx + ' ' + cy + ')');
      secHand.setAttribute('transform', 'rotate(' + (sec * 6) + ' ' + cx + ' ' + cy + ')');
      var hh = Math.floor(m / 60) === 0 ? 12 : Math.floor(m / 60);
      var mm = Math.round(m % 60);
      svg.setAttribute('aria-label', hh + ' 时 ' + mm + ' 分');
    }
    setAbs(state.absMinutes);

    return {
      el: svg,
      setAbs: function (m) { setAbs(m); return this; },
      getAbs: function () { return state.absMinutes; },
      /** 强调某根针：'hour' | 'minute' | 'second' | null */
      pick: function (which) {
        [['hour', hourHand], ['minute', minHand], ['second', secHand]].forEach(function (pair) {
          pair[1].classList.toggle('dim', which && pair[0] !== which);
        });
        return this;
      },
      /** 分针拖拽：把屏幕坐标换成分钟 */
      absFromPoint: function (clientX, clientY) {
        var box = svg.getBoundingClientRect();
        var sx = (clientX - box.left) / box.width * S;
        var sy = (clientY - box.top) / box.height * S;
        var ang = Math.atan2(sx - cx, cy - sy) * 180 / Math.PI;
        var deg = (ang + 360) % 360;
        return deg / 6; // 0~60 分钟
      }
    };
  }

  /* ══════════════════════════════════════════════════════
   * 图谱连接件
   * 课件不是一个孤立的页面：进来要看见它在图上的位置，
   * 学完要知道往哪走。两块都由构建时注入的 __GRAPH 驱动。
   * ══════════════════════════════════════════════════════ */
  function graphHref(tid) {
    var sc = null;
    try { sc = new URLSearchParams(location.search).get('sharecode'); } catch (e) { /* 老浏览器忽略 */ }
    return '../../index.html'
      + (sc ? '?sharecode=' + encodeURIComponent(sc) : '')
      + '#t=' + encodeURIComponent(tid);
  }

  function a(href, text, cls) {
    var el = document.createElement('a');
    el.href = href;
    el.textContent = text;
    if (cls) el.className = cls;
    return el;
  }

  /** 页首位置条：前置 → 本课 → 解锁 */
  function graphNav(container, G) {
    if (!container) return null;
    container.className = 'gnav';
    container.innerHTML = '';

    var pre = (G.prereqs || []).slice(0, 2);
    var post = (G.unlocks || []).slice(0, 2);

    container.appendChild(h('span', 'gnav-label', '前置'));
    if (pre.length) {
      pre.forEach(function (p, i) {
        if (i) container.appendChild(h('span', 'sep', '·'));
        container.appendChild(a(graphHref(p.id), p.name));
      });
    } else {
      container.appendChild(h('span', 'gnav-label', '无（本课是起点）'));
    }

    container.appendChild(h('span', 'sep', '→'));
    var self = h('span', 'gnav-pair');
    self.appendChild(h('span', 'gnav-label', '本课'));
    self.appendChild(a(graphHref(G.id), G.name, 'self'));
    container.appendChild(self);

    if (post.length) {
      container.appendChild(h('span', 'sep', '→'));
      container.appendChild(h('span', 'gnav-label', '解锁'));
      post.forEach(function (p, i) {
        if (i) container.appendChild(h('span', 'sep', '·'));
        container.appendChild(a(graphHref(p.id), p.name));
      });
    }
    return container;
  }

  /** 页尾延伸：补先修、接着学、在图谱里看 */
  function extend(container, G, opts) {
    if (!container) return null;
    opts = opts || {};
    container.innerHTML = '';

    function block(title, note, items, tagText) {
      if (!items || !items.length) return;
      var wrap = h('div', 'extend');
      var head = h('h3', null, title);
      if (note) head.appendChild(h('small', null, note));
      wrap.appendChild(head);
      items.forEach(function (it) {
        var row = document.createElement('a');
        row.className = 'ext-item';
        row.href = graphHref(it.id);
        var who = h('div', 'who');
        who.appendChild(h('b', null, it.name));
        who.appendChild(h('span', null, (it.subject || '') + ' · ' + it.grade + ' 年级'
          + (it.reason ? '　' + it.reason : '')));
        row.appendChild(who);
        var tag = h('span', 'tag' + (it.course === 'reviewed' ? ' has' : ''),
          it.course === 'reviewed' ? '有课件' : (tagText || '在图谱中'));
        row.appendChild(tag);
        wrap.appendChild(row);
      });
      container.appendChild(wrap);
    }

    // 1) 先修：给「学不动时回哪去」一个具体去处
    block('回去补一补', '这些没弄熟，本课容易卡住', G.prereqs, '先修');

    // 2) 接着学：优先推有课件的，没课件也给出去向
    var nexts = (G.unlocks || []).slice();
    nexts.sort(function (x, y) {
      var cx = x.course === 'reviewed' ? 0 : 1;
      var cy = y.course === 'reviewed' ? 0 : 1;
      return cx - cy || x.grade - y.grade;
    });
    block('接着学', '本课是这些内容的前置', nexts.slice(0, 3), '后续');

    // 3) 在图谱里看：把课上用到但没展开的信息摊开
    var info = h('div', 'extend');
    var t3 = h('h3', null, '这一课在图谱里是什么');
    info.appendChild(t3);

    var card = h('div', 'card');
    var lines = [];
    lines.push('<b>领域</b>：' + G.domain + '　<b>学段</b>：' + G.stage + '　<b>年级</b>：' + G.grade + ' 年级');
    if (G.standards && G.standards.length) {
      lines.push('<b>课标</b>：' + G.standards.join('、'));
    }
    if (G.textbookLabels && G.textbookLabels.length) {
      lines.push('<b>教材</b>：' + G.textbookLabels.join('；'));
    } else if (G.textbooks && G.textbooks.length) {
      lines.push('<b>教材</b>：' + G.textbooks.join('；'));
    }
    card.innerHTML = lines.map(function (x) { return '<p style="margin:0 0 6px">' + x + '</p>'; }).join('');
    info.appendChild(card);

    if (G.siblings && G.siblings.length) {
      info.appendChild(h('p', 'ext-note', '同一个领域里的其他知识点：'));
      var row = h('div', 'gnav');
      G.siblings.forEach(function (sb) {
        row.appendChild(a(graphHref(sb.id), sb.name));
      });
      info.appendChild(row);
    }

    info.appendChild(a(graphHref(G.id), '在图谱中查看「' + G.name + '」', 'ext-item'));
    container.appendChild(info);

    return container;
  }

  global.CR = {
    vertical: vertical,
    geometry: geometry,
    numberline: numberline,
    coords: coords,
    clock: clock,
    graphNav: graphNav,
    extend: extend,
    graphHref: graphHref,
    reduced: reduced
  };
})(window);

</script>
<script>
(function () {
  'use strict';

  var TOPIC_ID = 'mt_addsub-10000';
  var COURSE_VERSION = '2.0.0';
  var startedAt = Date.now();

  /* ── 题库：a/b/op 直接给竖式用，expr 供校验器复算 ───────── */
  var QUIZ = [
    {
      id: 'q1', type: 'number', label: '先热身', tag: '一次进位',
      a: 345, b: 278, op: '+', answer: 623, expr: '345+278',
      hint: '个位 5+8=13，写 3，向十位进 1；十位 4+7+1=12，写 2，向百位进 1；百位 3+2+1=6。',
      why: '进位加的 1 要加进下一位，不是写在旁边就算完。'
    },
    {
      id: 'q2', type: 'number', label: '两次进位', tag: '连续进位',
      a: 907, b: 486, op: '+', answer: 1393, expr: '907+486',
      hint: '个位 7+6=13 进 1；十位 0+8+1=9，不进位；百位 9+4=13 进 1，千位写 1。',
      why: '这题最容易错在百位：9+4=13 已经满 10，可十位没进位，所以百位只进 1 位。'
    },
    {
      id: 'q3', type: 'number', label: '连着借两次', tag: '连续退位',
      a: 1000, b: 365, op: '-', answer: 635, expr: '1000-365',
      hint: '个位 0 不够减，向十位借；十位是 0，继续向百位借；百位也是 0，再向千位借 1 当 10。',
      why: '借位要一级一级借，借过的数不能又被借一次——先点上退位点再算。'
    },
    {
      id: 'q4', type: 'number', label: '两次都满十', tag: '诊断题',
      a: 745, b: 268, op: '+', answer: 1013, expr: '745+268',
      hint: '个位 5+8=13 进 1；十位 4+6+1=11 再进 1；百位 7+2+1=10，千位写 1。',
      why: '十位和百位都满 10，两个进位都要写；漏一个就差 100。'
    },
    {
      id: 'q5', type: 'choice', label: '不算竖式，估一估', tag: '估算',
      prompt: '907 + 486 大约是多少？',
      answer: '1400 左右',
      options: ['1100 左右', '1400 左右', '1800 左右'],
      hint: '907 看成 900，486 看成 500，合起来 1400。',
      why: '估算是检查工具：算完发现离估计太远，基本就是进位出了问题。'
    },
    {
      id: 'q6', type: 'number', label: '十位是 0 的退位', tag: '易错',
      a: 602, b: 378, op: '-', answer: 224, expr: '602-378',
      hint: '个位 2 不够减 8，向十位借；十位是 0，先从百位借 1 变成 10，再借给个位。',
      why: '十位是 0 时不能直接借，要先从百位借。这一步漏了，整题就崩。'
    }
  ];

  /* 校验器会读这段做复算 */
  window.__ANSWERS = [
    {"id":"q1","kind":"number","value":623,"expr":"345+278"},
    {"id":"q2","kind":"number","value":1393,"expr":"907+486"},
    {"id":"q3","kind":"number","value":635,"expr":"1000-365"},
    {"id":"q4","kind":"number","value":1013,"expr":"745+268"},
    {"id":"q5","kind":"choice","value":"1400 左右"},
    {"id":"q6","kind":"number","value":224,"expr":"602-378"}
  ];

  var $ = function (id) { return document.getElementById(id); };
  var idx = -1;                       // -1 = 引入页
  var state = QUIZ.map(function () { return { attempts: 0, solved: false, first: false }; });
  var firstTry = 0;
  var currentViz = null;

  /* ── 图谱位置条（数据来自构建时注入的 __GRAPH）─────────── */
  var G = window.__GRAPH || null;
  if (G && window.CR && CR.graphNav) {
    CR.graphNav($('gnav'), G);
  } else {
    $('gnav').style.display = 'none';
  }

  /* ── 引入页演示：345 + 278，先不给答案，只演示进位 ─────── */
  function demo() {
    if (!window.CR) return;
    $('demoViz').innerHTML = '';
    var v = CR.vertical($('demoViz'), { a: 345, b: 278, op: '+', carries: false });
    currentViz = v;
    var i = 0;
    (function step() {
      if (i > 3) {
        v.carries(true);
        $('demoCap').innerHTML = '三位都算完了。<b>两个小 1</b> 就是两次进位——漏掉任何一个，答案就错。';
        return;
      }
      v.reveal(i);
      i++;
      setTimeout(step, CR.reduced() ? 0 : 850);
    })();
  }
  $('demoReplay').onclick = demo;

  /* ── 题目渲染 ─────────────────────────────────────────── */
  var dotsEl = $('dots');
  QUIZ.forEach(function () { dotsEl.appendChild(document.createElement('i')); });
  var dotEls = [].slice.call(dotsEl.children);

  function renderDots() {
    dotEls.forEach(function (d, i) {
      d.className = i === idx ? 'on' : state[i].solved ? 'ok' : (state[i].attempts ? 'bad' : '');
    });
  }

  function updateBar() {
    var done = state.filter(function (s) { return s.solved; }).length;
    $('pbar').style.width = (done / QUIZ.length * 100) + '%';
    $('pnum').textContent = idx < 0 ? '准备' : '第 ' + (idx + 1) + ' / ' + QUIZ.length + ' 题';
  }

  function stage(name) {
    ['intro', 'quiz', 'summary'].forEach(function (k) {
      $(k).classList.toggle('active', k === name);
    });
  }

  function render() {
    var q = QUIZ[idx], st = state[idx];
    $('qLabel').textContent = q.label;
    $('qTag').textContent = q.tag || '';
    $('qViz').innerHTML = '';
    $('qViz').className = 'viz';
    currentViz = null;

    if (q.type === 'number') {
      currentViz = CR.vertical($('qViz'), { a: q.a, b: q.b, op: q.op, carries: false });
      $('qCap').innerHTML = '在竖式上算：<b>' + q.a + (q.op === '+' ? ' + ' : ' − ') + q.b + '</b>';
      $('qBody').innerHTML =
        '<div class="answer-row">' +
        '<input id="ans" type="number" inputmode="numeric" aria-label="输入答案" placeholder="填答案" value="' + (st.lastValue || '') + '">' +
        '</div>';
      $('ans').addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      if (!st.solved) setTimeout(function () { $('ans').focus(); }, 60);
    } else {
      $('qViz').className = '';
      $('qCap').innerHTML = '这题不用算，<b>估一估</b>';
      $('qBody').innerHTML =
        '<p style="font-size:17px;margin:14px 0">' + q.prompt + '</p>' +
        '<div class="options">' + q.options.map(function (o) {
          return '<button class="opt" data-val="' + o + '">' + o + '</button>';
        }).join('') + '</div>';
      [].slice.call(document.querySelectorAll('.opt')).forEach(function (b) {
        b.onclick = function () { pickChoice(b); };
      });
    }

    $('feedback').innerHTML = st.solved ? '<div class="card ok">这题已经答对了。</div>' : '';
    $('whyBox').innerHTML = st.attempts && !st.solved ? '<b>可能的错法：</b>' + q.why : '';
    $('hintBtn').style.display = (st.solved || q.type !== 'number') ? 'none' : '';
    $('hintBtn').disabled = false;
    $('hintBtn').textContent = '看进位标记';
    $('checkBtn').style.display = q.type === 'number' ? '' : 'none';
    $('checkBtn').disabled = st.solved;
    $('next').disabled = !st.solved && idx < QUIZ.length - 1;
    $('next').textContent = (idx >= QUIZ.length - 1 && st.solved) ? '完成' : '下一题';
    $('prev').disabled = idx <= 0;
    renderDots();
    updateBar();
  }

  function markSolved() {
    var st = state[idx];
    st.solved = true;
    st.first = st.attempts === 1;
    if (st.first) firstTry++;
  }

  function afterSolved(q) {
    if (currentViz) currentViz.carries(true).reveal(99);
    $('feedback').innerHTML = '<div class="card ok">对，答案是 <b>' + q.answer + '</b>。' + q.hint + '</div>';
    $('whyBox').innerHTML = '';
    var ansEl = $('ans');
    if (ansEl) { ansEl.value = q.answer; ansEl.readOnly = true; }
    $('hintBtn').style.display = 'none';
    $('checkBtn').style.display = 'none';
    $('next').disabled = false;
    $('next').textContent = idx >= QUIZ.length - 1 ? '完成' : '下一题';
    renderDots();
    updateBar();
  }

  function check() {
    var q = QUIZ[idx], st = state[idx];
    if (st.solved) return;
    var raw = $('ans').value.trim();
    if (raw === '') { $('feedback').innerHTML = '<div class="card tip">先填一个数。</div>'; return; }
    st.attempts++;
    st.lastValue = raw;
    if (Number(raw) === q.answer) {
      markSolved();
      afterSolved(q);
    } else {
      renderDots();
      $('feedback').innerHTML = '<div class="card pitfall">再想想。先把这一位的进位或退位标出来，再往下算。</div>';
      $('whyBox').innerHTML = '<b>可能的错法：</b>' + q.why;
      $('next').disabled = true;
    }
  }

  function pickChoice(btn) {
    var q = QUIZ[idx], st = state[idx];
    if (st.solved) return;
    st.attempts++;
    if (btn.dataset.val === q.answer) {
      btn.classList.add('right');
      markSolved();
      afterSolved(q);
    } else {
      btn.classList.add('wrong');
      renderDots();
      $('feedback').innerHTML = '<div class="card pitfall">不对。把两个数都往大一点估，再比一比。</div>';
      $('whyBox').innerHTML = '<b>提示：</b>' + q.hint;
    }
  }

  $('checkBtn').onclick = check;

  /* 看进位标记：只给脚手架，不给答案 */
  $('hintBtn').onclick = function () {
    var q = QUIZ[idx];
    if (!currentViz || q.type !== 'number') return;
    currentViz.carries(true);
    this.disabled = true;
    this.textContent = '已标出进位';
    $('feedback').innerHTML =
      '<div class="card tip">进位 / 退位已经标在竖式上方了。' +
      (q.op === '+' ? '那个小 1 要加进左边一位。' : '退位点表示这一位少了 1。') + '</div>';
  };

  function go(n) {
    idx = Math.max(0, Math.min(QUIZ.length - 1, n));
    stage('quiz');
    render();
  }

  $('prev').onclick = function () { if (idx > 0) go(idx - 1); };
  $('next').onclick = function () {
    if (idx < 0) { go(0); return; }
    if (idx >= QUIZ.length - 1) { finish(); return; }
    go(idx + 1);
  };

  /* ── 结算 ─────────────────────────────────────────────── */
  function finish() {
    var mins = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
    $('scoreText').innerHTML = firstTry + ' / ' + QUIZ.length + ' <small>一次答对</small>';
    $('timeText').textContent = '用时约 ' + mins + ' 分钟';

    var advice;
    if (firstTry === QUIZ.length) {
      advice = '这个水平可以往下走了：乘除法会大量复用「满十进一」的思路。';
    } else if (firstTry >= QUIZ.length - 2) {
      advice = '基本稳了。错的题多半是进位没标，做题时先把小 1 写上去再算。';
    } else {
      advice = '建议把「看进位标记」用熟：每算一位就标一次，比事后检查有效。';
    }
    $('advice').textContent = advice;

    try {
      localStorage.setItem('stx.course.' + TOPIC_ID, JSON.stringify({
        done: true, score: firstTry / QUIZ.length, minutes: mins, at: Date.now(), v: COURSE_VERSION
      }));
    } catch (e) { /* 隐私模式忽略 */ }

    stage('summary');
    if (G && window.CR && CR.extend) {
      CR.extend($('extend'), G, { score: firstTry + '/' + QUIZ.length });
    }

    $('next').textContent = '返回图谱…';
    $('next').disabled = true;
    // ?stay=1 用于本地预览：停在结算页，不自动跳回图谱
    if (new URLSearchParams(location.search).get('stay') === '1') return;
    var sc = new URLSearchParams(location.search).get('sharecode');
    setTimeout(function () {
      var q = new URLSearchParams();
      if (sc) q.set('sharecode', sc);
      q.set('done', '1');
      q.set('score', firstTry + '/' + QUIZ.length);
      q.set('minutes', String(mins));
      location.href = '../../index.html?' + q.toString() + '#t=' + TOPIC_ID;
    }, 900);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' && $('next').disabled === false) $('next').click();
    if (e.key === 'ArrowLeft' && $('prev').disabled === false) $('prev').click();
  });

  /* 线上分享链接用 ?sharecode= 鉴权，回跳时带上 */
  (function () {
    var sc = new URLSearchParams(location.search).get('sharecode');
    if (!sc) return;
    [].slice.call(document.querySelectorAll('a[href*="index.html"]')).forEach(function (a) {
      var href = a.getAttribute('href');
      if (href.indexOf('sharecode=') >= 0) return;
      var i = href.indexOf('#');
      var base = i >= 0 ? href.slice(0, i) : href;
      var tail = i >= 0 ? href.slice(i) : '';
      a.setAttribute('href', base + '?sharecode=' + encodeURIComponent(sc) + tail);
    });
  })();

  demo();
  stage('intro');
  updateBar();
})();
</script>
