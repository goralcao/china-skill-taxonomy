<style>
/* 学阶图谱课件 · 共享样式

:root {
  --bg: #0a0f18;
  --panel: #0f1620;
  --card: #141d29;
  --line: #24303f;
  --text: #e8edf5;
  --dim: #8b98ab;
  --accent: #ffd166;
  --ok: #4ade80;
  --bad: #f87171;
  --carry: #60a5fa;
  --borrow: #fb923c;
  --geo: #a78bfa;
  --num: #38bdf8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  padding: 0 16px calc(88px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: rgba(10, 15, 24, .94);
  backdrop-filter: blur(8px);
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 12px;
  align-items: center;
}

header .back { color: var(--dim); text-decoration: none; font-size: 13px; }
header .back:hover { color: var(--text); }

main { max-width: 720px; margin: 0 auto; padding-top: 14px; }

h1 { font-size: 21px; margin: 0 0 8px; line-height: 1.4; }
h2 { font-size: 17px; margin: 0 0 10px; line-height: 1.5; }
h1:focus, h2:focus { outline: none; }
p { margin: 0 0 10px; }

.muted { color: var(--dim); font-size: 13.5px; }
.mono { font-variant-numeric: tabular-nums; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 14px 0;
}
.card.tip { border-left: 3px solid var(--accent); }
.card.pitfall { border-left: 3px solid var(--bad); }
.card.ok { border-left: 3px solid var(--ok); }
.card:last-child { margin-bottom: 0; }

/* 步骤 */
.step { display: none; }
.step.active { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 底部导航 */
footer {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(10, 15, 24, .96);
  border-top: 1px solid var(--line);
}
footer .progress { flex: 1; font-size: 12px; color: var(--dim); }
footer .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
footer .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

.btn {
  padding: 11px 18px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  min-height: 44px;
  cursor: pointer;
  touch-action: manipulation;
  font-family: inherit;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); color: #1a1300; border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 8px 13px; min-height: 38px; font-size: 13.5px; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type="number"], input[type="text"] {
  font-family: inherit;
  font-size: 20px;
  font-variant-numeric: tabular-nums;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  width: 140px;
  text-align: center;
}
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ── 图谱位置条 ───────────────────────────────────────── */
.gnav {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  font-size: 12px;
  line-height: 1.9;
  padding: 6px 10px;
  margin: 0 0 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.gnav .gnav-label { color: var(--dim); font-size: 11.5px; padding: 0 1px; }
.gnav a {
  color: #cbd5e1;
  text-decoration: underline;
  text-decoration-color: rgba(203, 213, 225, .3);
  text-underline-offset: 3px;
  padding: 1px 1px;
  white-space: nowrap;
}
.gnav a:hover { color: var(--accent); text-decoration-color: var(--accent); }
.gnav a.self {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 1px 8px;
}
.gnav .sep { color: #3f4c5e; padding: 0 1px; }
.gnav .gnav-pair { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

/* ── 延伸区块 ─────────────────────────────────────────── */
.extend { margin: 22px 0 8px; }
.extend h3 { font-size: 15px; margin: 0 0 10px; color: var(--text); }

.ext-item {

  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  margin-bottom: 8px;
  text-decoration: none;
  color: var(--text);

}

  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid var(--line);

}

.ext-note { font-size: 12.5px; color: var(--dim); margin: 2px 0 12px; }

.viz {

}

.viz-cap b { color: var(--accent); font-weight: 600; }

/* ── 竖式 ─────────────────────────────────────────────── */
.vert {
  display: inline-block;
  font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  font-size: 30px;
  font-variant-numeric: tabular-nums;
  line-height: 1.14;
  color: var(--text);
  user-select: none;
}
.vert .vrow { display: grid; align-items: center; justify-items: center; }
.vert .vrow > span { min-width: 1.14em; text-align: center; }
.vert .vcarry > span { font-size: .46em; font-weight: 700; color: var(--carry); height: 1.05em; }
.vert .vcarry > span.borrow { color: #fb923c; font-size: .62em; }
.vert .vop { color: var(--dim); }
.vert .vline {
  height: 3px;
  background: var(--text);
  border-radius: 2px;
  margin: 3px 0 5px;
}
.vert .vans > span { color: var(--accent); font-weight: 700; }
.vert .vans > span.hide { color: transparent; }
.vert .vrow > span.done { color: var(--ok); }
.vert .vrow > span.pending { opacity: .34; }
.vert .vdots { letter-spacing: .18em; color: var(--dim); }

.geo-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.geo-cell {
  fill: transparent;
  stroke: rgba(167, 139, 250, .22);
  stroke-width: .8;
  transition: fill .18s;
}
.geo-cell.on { fill: rgba(167, 139, 250, .52); stroke: rgba(200, 180, 255, .6); }
.geo-outline { fill: none; stroke: var(--geo); stroke-width: 2.2; }
.geo-label { fill: var(--text); font-size: 13px; font-family: inherit; }
.geo-dim { stroke: var(--num); stroke-width: 1.6; }
.geo-dim-text { fill: var(--num); font-size: 12.5px; font-family: inherit; }
.geo-piece { transition: transform .5s cubic-bezier(.4, 0, .2, 1); }

.nl-tick { stroke: var(--dim); stroke-width: 1.2; }
.nl-text { fill: var(--dim); font-size: 11.5px; font-family: inherit; text-anchor: middle; }

.nl-point-label { fill: var(--text); font-size: 12.5px; font-weight: 600; font-family: inherit; text-anchor: middle; }

.cx-text { fill: var(--dim); font-size: 11px; font-family: inherit; }
.cx-curve { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.cx-dot { fill: var(--accent); }
.cx-dot-label { fill: var(--text); font-size: 12px; font-family: inherit; }

.ck-face { fill: var(--card); stroke: var(--line); stroke-width: 2; }
.ck-tick { stroke: var(--dim); stroke-width: 1.4; }

.ck-num { fill: var(--dim); font-size: 13px; font-family: inherit; text-anchor: middle; dominant-baseline: middle; }
.ck-hand { stroke-linecap: round; }
.ck-hand.hour { stroke: var(--text); stroke-width: 5; }
.ck-hand.minute { stroke: var(--num); stroke-width: 3.4; }
.ck-hand.second { stroke: var(--bad); stroke-width: 1.6; }
.ck-hand.dim { opacity: .28; }
.ck-center { fill: var(--accent); }

/* ── 题目（引擎与手写页面共用） ─────────────────────── */
.quiz-q { font-size: 16.5px; margin: 16px 0 4px; line-height: 1.65; }

.answer-row {

}
.answer-row .unit { color: var(--dim); font-size: 14px; }
.options { display: grid; gap: 10px; margin: 14px 0; }
.opt {
  padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 16px; text-align: left;

}

.opt.right { border-color: var(--ok); background: rgba(74, 222, 128, .12); }
.opt.wrong { border-color: var(--bad); background: rgba(248, 113, 113, .12); }
.score { font-size: 38px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.score small { font-size: 15px; color: var(--dim); font-weight: 400; }

  /* ══════════════════════════════════════════════════════

  /* ══════════════════════════════════════════════════════

   * ══════════════════════════════════════════════════════ */

    var sc = null;
    try { sc = new URLSearchParams(location.search).get('sharecode'); } catch (e) { /* 老浏览器忽略 */ }
    return '../../index.html'
      + (sc ? '?sharecode=' + encodeURIComponent(sc) : '')
      + '#t=' + encodeURIComponent(tid);
  }

  function a(href, text, cls) {
    var el = document.createElement('a');
    el.href = href;
    el.textContent = text;
    if (cls) el.className = cls;

  }

  /** 页首位置条：前置 → 本课 → 解锁 */
  function graphNav(container, G) {
    if (!container) return null;
    container.className = 'gnav';
    container.innerHTML = '';

    var pre = (G.prereqs || []).slice(0, 2);
    var post = (G.unlocks || []).slice(0, 2);

    container.appendChild(h('span', 'gnav-label', '前置'));
    if (pre.length) {
      pre.forEach(function (p, i) {
        if (i) container.appendChild(h('span', 'sep', '·'));
        container.appendChild(a(graphHref(p.id), p.name));
      });
    } else {
      container.appendChild(h('span', 'gnav-label', '无（本课是起点）'));
    }

    container.appendChild(h('span', 'sep', '→'));
    var self = h('span', 'gnav-pair');
    self.appendChild(h('span', 'gnav-label', '本课'));
    self.appendChild(a(graphHref(G.id), G.name, 'self'));
    container.appendChild(self);

    if (post.length) {
      container.appendChild(h('span', 'sep', '→'));
      container.appendChild(h('span', 'gnav-label', '解锁'));
      post.forEach(function (p, i) {
        if (i) container.appendChild(h('span', 'sep', '·'));
        container.appendChild(a(graphHref(p.id), p.name));
      });
    }
    return container;
  }

  /** 页尾延伸：补先修、接着学、在图谱里看 */

    if (!container) return null;
    opts = opts || {};
    container.innerHTML = '';

    function block(title, note, items, tagText) {
      if (!items || !items.length) return;
      var wrap = h('div', 'extend');
      var head = h('h3', null, title);
      if (note) head.appendChild(h('small', null, note));
      wrap.appendChild(head);
      items.forEach(function (it) {
        var row = document.createElement('a');
        row.className = 'ext-item';
        row.href = graphHref(it.id);
        var who = h('div', 'who');
        who.appendChild(h('b', null, it.name));
        who.appendChild(h('span', null, (it.subject || '') + ' · ' + it.grade + ' 年级'
          + (it.reason ? '　' + it.reason : '')));
        row.appendChild(who);
        var tag = h('span', 'tag' + (it.course === 'reviewed' ? ' has' : ''),
          it.course === 'reviewed' ? '有课件' : (tagText || '在图谱中'));
        row.appendChild(tag);
        wrap.appendChild(row);
      });
      container.appendChild(wrap);
    }

    // 1) 先修：给「学不动时回哪去」一个具体去处
    block('回去补一补', '这些没弄熟，本课容易卡住', G.prereqs, '先修');

    // 2) 接着学：优先推有课件的，没课件也给出去向
    var nexts = (G.unlocks || []).slice();
    nexts.sort(function (x, y) {
      var cx = x.course === 'reviewed' ? 0 : 1;
      var cy = y.course === 'reviewed' ? 0 : 1;
      return cx - cy || x.grade - y.grade;
    });
    block('接着学', '本课是这些内容的前置', nexts.slice(0, 3), '后续');

    // 3) 在图谱里看：把课上用到但没展开的信息摊开
    var info = h('div', 'extend');
    var t3 = h('h3', null, '这一课在图谱里是什么');
    info.appendChild(t3);

    var card = h('div', 'card');
    var lines = [];
    lines.push('<b>领域</b>：' + G.domain + '　<b>学段</b>：' + G.stage + '　<b>年级</b>：' + G.grade + ' 年级');
    if (G.standards && G.standards.length) {
      lines.push('<b>课标</b>：' + G.standards.join('、'));
    }
    if (G.textbookLabels && G.textbookLabels.length) {
      lines.push('<b>教材</b>：' + G.textbookLabels.join('；'));
    } else if (G.textbooks && G.textbooks.length) {
      lines.push('<b>教材</b>：' + G.textbooks.join('；'));
    }
    card.innerHTML = lines.map(function (x) { return '<p style="margin:0 0 6px">' + x + '</p>'; }).join('');
    info.appendChild(card);

    if (G.siblings && G.siblings.length) {
      info.appendChild(h('p', 'ext-note', '同一个领域里的其他知识点：'));
      var row = h('div', 'gnav');
      G.siblings.forEach(function (sb) {
        row.appendChild(a(graphHref(sb.id), sb.name));
      });
      info.appendChild(row);
    }

    info.appendChild(a(graphHref(G.id), '在图谱中查看「' + G.name + '」', 'ext-item'));
    container.appendChild(info);

    return container;
  }

  global.CR = {
    vertical: vertical,
    geometry: geometry,
    numberline: numberline,
    coords: coords,
    clock: clock,
    graphNav: graphNav,
    extend: extend,
    graphHref: graphHref,
    reduced: reduced
  };
})(window);

<script>
/* 学阶图谱课件 · 渲染引擎
 *
 * 手写页面适合一次性精品，但一册 30 个就会失控：
 * 每份 HTML 都在重复导航、判分、结算、图谱延伸。
 *
 * 这个引擎把那些重复收进一份，课件只留 content.json：
 *   { topicId, title, template, renderer, steps: [...] }
 *
 * step 类型见下方 RENDER 表。渲染器来自 CR.*，图谱连接件来自 CR.graphNav / CR.extend。
 */
(function (global) {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var h = function (tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  };

  function mount(content) {
    var C = content;
    var G = global.__GRAPH || null;
    var answers = [];          // { id, ok, first }
    var state = {};            // stepIndex -> { solved, attempts, first }
    var cur = 0;
    var startedAt = Date.now();
    var total = C.steps.length;

    /* ── 外壳 ─────────────────────────────────────────── */
    var header = h('header');
    var back = h('a', 'back', '← 回到图谱');
    back.href = '../../index.html#t=' + C.topicId;
    header.appendChild(back);
    var tag = h('span', 'muted', C.subject + ' · ' + C.grade + ' 年级 · ' + C.title);
    tag.style.marginLeft = 'auto';
    header.appendChild(tag);

    var main = h('main');
    var gnav = h('div');
    gnav.id = 'gnav';
    main.appendChild(gnav);

    var stage = h('div');
    main.appendChild(stage);

    var footer = h('footer');
    var prog = h('div', 'progress');
    var pnum = h('span', null, '');
    var bar = h('div', 'bar');
    var fill = h('i');
    bar.appendChild(fill);
    prog.appendChild(pnum);
    prog.appendChild(bar);
    var btnPrev = h('button', 'btn', '上一步');
    btnPrev.id = 'prev';
    btnPrev.setAttribute('aria-label', '上一步');
    var btnNext = h('button', 'btn primary', '下一步');
    btnNext.id = 'next';
    footer.appendChild(prog);
    footer.appendChild(btnPrev);
    footer.appendChild(btnNext);

    document.body.appendChild(header);
    document.body.appendChild(main);
    document.body.appendChild(footer);

    if (G && CR.graphNav) CR.graphNav(gnav, G);
    else gnav.style.display = 'none';

    /* ── 各 step 的渲染 ───────────────────────────────── */
    var RENDER = {
      intro: function (s) {
        var f = document.createDocumentFragment();
        f.appendChild(h('h1', null, s.title));
        if (s.lead) f.appendChild(h('p', 'muted', s.lead));
        (s.bullets || []).forEach(function (b) {
          var card = h('div', 'card' + (b.warn ? ' pitfall' : ' tip'));
          card.innerHTML = '<p style="margin:0">' + b.text + '</p>';
          f.appendChild(card);
        });
        return f;
      },

      text: function (s) {
        var f = document.createDocumentFragment();
        f.appendChild(h('h2', null, s.title));
        (s.paras || []).forEach(function (p) {
          var el = h('p', s.muted ? 'muted' : null);
          el.innerHTML = p;
          f.appendChild(el);
        });
        if (s.note) {
          var card = h('div', 'card tip');
          card.innerHTML = '<p style="margin:0">' + s.note + '</p>';
          f.appendChild(card);
        }
        return f;
      },

      vertical: function (s) {
        var f = document.createDocumentFragment();
        if (s.title) f.appendChild(h('h2', null, s.title));
        var box = h('div', 'viz');
        f.appendChild(box);
        if (s.caption) {
          var cap = h('div', 'viz-cap');
          cap.innerHTML = s.caption;
          f.appendChild(cap);
        }
        var v = CR.vertical(box, {
          a: s.problem.a, b: s.problem.b, op: s.problem.op,
          carries: s.carries !== false,
          reveal: s.reveal === 'all' ? 99 : 0,
        });
        if (s.play) v.carries(false);
        if (s.note) {
          var card = h('div', 'card' + (s.warn ? ' pitfall' : ' tip'));
          card.innerHTML = '<p style="margin:0">' + s.note + '</p>';
          f.appendChild(card);
        }
        return f;
      },

      geometry: function (s) {
        var f = document.createDocumentFragment();
        if (s.title) f.appendChild(h('h2', null, s.title));
        var box = h('div', 'viz');
        f.appendChild(box);
        var g = CR.geometry(box, s.shape);
        // 只有显式给 revealTo 才覆盖初始状态：分数图按 filled 初始化，不能被涂满
        if (s.revealTo != null && g.reveal) g.reveal(s.revealTo);
        if (s.caption) {
          var cap = h('div', 'viz-cap');
          cap.innerHTML = s.caption;
          f.appendChild(cap);
        }
        if (s.note) {
          var card = h('div', 'card' + (s.warn ? ' pitfall' : ' tip'));
          card.innerHTML = '<p style="margin:0">' + s.note + '</p>';
          f.appendChild(card);
        }
        return f;
      },

      numberline: function (s) {
        var f = document.createDocumentFragment();
        if (s.title) f.appendChild(h('h2', null, s.title));
        var box = h('div', 'viz');
        f.appendChild(box);
        CR.numberline(box, s.line);
        if (s.caption) {
          var cap = h('div', 'viz-cap');
          cap.innerHTML = s.caption;
          f.appendChild(cap);
        }
        return f;
      },

      clock: function (s) {
        var f = document.createDocumentFragment();
        if (s.title) f.appendChild(h('h2', null, s.title));
        var box = h('div', 'viz');
        f.appendChild(box);
        CR.clock(box, { absMinutes: s.absMinutes || 480, showSecond: false });
        if (s.caption) {
          var cap = h('div', 'viz-cap');
          cap.innerHTML = s.caption;
          f.appendChild(cap);
        }
        return f;
      },

      quiz: function (s, i) {
        var f = document.createDocumentFragment();
        if (s.title) f.appendChild(h('h2', null, s.title));
        var q = h('p', 'quiz-q');
        q.innerHTML = s.question;
        f.appendChild(q);

        var row = h('div', 'answer-row');
        var input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.id = 'q' + i;
        input.setAttribute('aria-label', '输入答案');
        input.placeholder = '填答案';
        row.appendChild(input);
        if (s.unit) row.appendChild(h('span', 'unit', s.unit));
        var btn = h('button', 'btn small', '对答案');
        btn.id = 'check' + i;
        row.appendChild(btn);
        f.appendChild(row);

        var fb = h('div');
        fb.id = 'fb' + i;
        f.appendChild(fb);

        var st = stateOf(i);
        function check() {
          if (st.solved) return;
          var raw = input.value.trim();
          if (raw === '') { fb.innerHTML = '<div class="card tip">先填一个数。</div>'; return; }
          st.attempts++;
          if (Math.abs(Number(raw) - s.answer) < 1e-9) {
            st.solved = true; st.first = st.attempts === 1;
            input.readOnly = true;
            fb.innerHTML = '<div class="card ok">对，' + s.answer + (s.unit ? ' ' + s.unit : '') + '。' + (s.hint || '') + '</div>';
            btn.style.display = 'none';
            syncNav();
          } else {
            fb.innerHTML = '<div class="card pitfall">' + (s.why || '再算一遍，看看是不是漏了进位。') + '</div>';
          }
        }
        btn.onclick = check;
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
        return f;
      },

      choice: function (s, i) {
        var f = document.createDocumentFragment();
        if (s.title) f.appendChild(h('h2', null, s.title));
        var q = h('p', 'quiz-q');
        q.innerHTML = s.question;
        f.appendChild(q);

        var wrap = h('div', 'options');
        s.options.forEach(function (o) {
          var b = h('button', 'opt', o);
          b.type = 'button';
          b.onclick = function () {
            var st = stateOf(i);
            if (st.solved) return;
            st.attempts++;
            if (o === s.answer) {
              b.classList.add('right');
              st.solved = true; st.first = st.attempts === 1;
              if (s.hint) {
                var fb = h('div', 'card ok');
                fb.innerHTML = s.hint;
                f.appendChild(fb);
              }
              syncNav();
            } else {
              b.classList.add('wrong');
              if (s.why) {
                var fb2 = h('div', 'card pitfall');
                fb2.innerHTML = s.why;
                f.appendChild(fb2);
              }
            }
          };
          wrap.appendChild(b);
        });
        f.appendChild(wrap);
        return f;
      },

      summary: function (s) {
        var f = document.createDocumentFragment();
        f.appendChild(h('h2', null, s.title || '小结'));
        if (s.points && s.points.length) {
          var card = h('div', 'card');
          s.points.forEach(function (p, i) {
            var el = h('p', null, (i + 1) + '　' + p);
            el.style.margin = i === s.points.length - 1 ? '0' : '0 0 8px';
            card.appendChild(el);
          });
          f.appendChild(card);
        }
        var score = h('div', 'card');
        score.id = 'scoreCard';
        f.appendChild(score);

        var ext = h('div');
        ext.id = 'extend';
        f.appendChild(ext);
        return f;
      },
    };

    function stateOf(i) {
      if (!state[i]) state[i] = { solved: false, attempts: 0, first: false };
      return state[i];
    }

    /* ── 步骤推进 ─────────────────────────────────────── */
    var sections = [];

    C.steps.forEach(function (s, i) {
      var sec = h('section', 'step' + (i === 0 ? ' active' : ''));
      sec.dataset.step = String(i + 1);
      var fn = RENDER[s.type];
      if (fn) sec.appendChild(fn(s, i));
      else sec.appendChild(h('p', 'muted', '（未知步骤类型：' + s.type + '）'));
      stage.appendChild(sec);
      sections.push(sec);
    });

    function isQuiz(i) {
      var t = C.steps[i] && C.steps[i].type;
      return t === 'quiz' || t === 'choice';
    }

    function syncNav() {
      pnum.textContent = C.steps[cur] && C.steps[cur].type === 'summary'
        ? '小结' : '第 ' + (cur + 1) + ' / ' + total + ' 步';
      fill.style.width = ((cur + 1) / total * 100) + '%';
      btnPrev.disabled = cur === 0;
      var last = cur === total - 1;
      btnNext.textContent = last ? '完成' : '下一步';
      // 题目没答对不让过（可以回退）
      btnNext.disabled = isQuiz(cur) && !stateOf(cur).solved && !last;
    }

    function show(i) {
      cur = Math.max(0, Math.min(total - 1, i));
      sections.forEach(function (s, k) { s.classList.toggle('active', k === cur); });
      syncNav();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    btnPrev.onclick = function () { show(cur - 1); };
    btnNext.onclick = function () {
      if (cur === total - 1) { finish(); return; }
      show(cur + 1);
    };
    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' && !btnNext.disabled) btnNext.click();
      if (e.key === 'ArrowLeft' && !btnPrev.disabled) btnPrev.click();
    });

    /* ── 结算 ─────────────────────────────────────────── */
    function finish() {
      var quizIdx = [];
      C.steps.forEach(function (s, i) { if (isQuiz(i)) quizIdx.push(i); });
      var first = quizIdx.filter(function (i) { return stateOf(i).first; }).length;
      var mins = Math.max(1, Math.round((Date.now() - startedAt) / 60000));

      var card = $('scoreCard');
      if (card) {
        card.innerHTML = '<div class="score">' + first + ' / ' + quizIdx.length +
          ' <small>一次答对</small></div>' +
          '<p class="muted" style="margin:6px 0 0">用时约 ' + mins + ' 分钟</p>' +
          (C.advice ? '<p style="margin:10px 0 0">' + adviceText(first, quizIdx.length) + '</p>' : '');
      }

      try {
        localStorage.setItem('stx.course.' + C.topicId, JSON.stringify({
          done: true,
          score: quizIdx.length ? first / quizIdx.length : 1,
          minutes: mins, at: Date.now(), v: C.version || '1.0.0',
        }));
      } catch (e) { /* 隐私模式忽略 */ }

      if (G && CR.extend) CR.extend($('extend'), G, { score: first + '/' + quizIdx.length });

      if (new URLSearchParams(location.search).get('stay') === '1') return;

      btnNext.textContent = '返回图谱…';
      btnNext.disabled = true;
      var sc = new URLSearchParams(location.search).get('sharecode');
      setTimeout(function () {
        var q = new URLSearchParams();
        if (sc) q.set('sharecode', sc);
        q.set('done', '1');
        q.set('score', first + '/' + quizIdx.length);
        q.set('minutes', String(mins));
        location.href = '../../index.html?' + q.toString() + '#t=' + C.topicId;
      }, 900);
    }

    function adviceText(got, all) {
      if (!all) return C.advice;
      if (got === all) return C.advice || '全对。可以往下走了。';
      if (got >= Math.ceil(all * 0.6)) return C.advice || '基本稳了，错的那道回头再看一遍步骤。';
      return '建议退回前面几步重看，再回来做一遍。';
    }

    /* 分享码透传 */
    (function () {
      var sc = new URLSearchParams(location.search).get('sharecode');
      if (!sc) return;
      [].slice.call(document.querySelectorAll('a[href*="index.html"]')).forEach(function (a) {
        var href = a.getAttribute('href');
        if (href.indexOf('sharecode=') >= 0) return;
        var i = href.indexOf('#');
        var base = i >= 0 ? href.slice(0, i) : href;
        var tail = i >= 0 ? href.slice(i) : '';
        a.setAttribute('href', base + '?sharecode=' + encodeURIComponent(sc) + tail);
      });
    })();

    show(0);
  }

  global.CourseEngine = { mount: mount };
})(window);

</script>
<script>window.__CONTENT = {"topicId": "mt_frac-same-addsub", "title": "同分母分数加减法", "subject": "数学", "grade": 3, "template": "explain", "renderer": "geometry", "version": "1.0.0", "steps": [{"type": "intro", "title": "分母为什么不变", "lead": "2/8 加 3/8，是 2 份加 3 份，一共 5 份。份的大小没变，变的只是「取了几份」。所以分母还是 8，只有分子相加。", "bullets": [{"text": "<b>分母不变</b>：每一份还是八分之一，没被切开也没被合并。"}, {"text": "<b>分子相加</b>：取 2 份再加 3 份，共 5 份，就是 5/8。"}, {"text": "<b>不是 5/16</b>：分母也相加，等于把每份又切小了，是错的。", "warn": true}]}, {"type": "geometry", "title": "先取 2 份", "shape": {"preset": "fraction", "parts": 8, "filled": 2}, "caption": "8 份里的 2 份，就是 <b>2/8</b>"}, {"type": "geometry", "title": "再取 3 份，合起来 5 份", "shape": {"preset": "fraction", "parts": 8, "filled": 5}, "caption": "2 份 + 3 份 = <b>5 份</b>，所以 2/8 + 3/8 = <b>5/8</b>", "note": "分母一直是 8。图上分的还是 8 份，只是涂色的部分多了。"}, {"type": "text", "title": "减法也一样", "paras": ["7/10 − 4/10：10 份里取 7 份，拿走 4 份，还剩 <b>3 份</b>，即 <b>3/10</b>。", "分母还是 10，只把分子相减。"], "note": "算完看一眼：分子比分母大吗？同分母加法里，分子加起来超过分母，说明超过 1 了。"}, {"type": "choice", "title": "加法", "question": "3/8 + 2/8 = ？", "options": ["5/8", "5/16", "6/8"], "answer": "5/8", "hint": "分母不变，分子 3 + 2 = 5。", "why": "5/16 是把分母也加了；6/8 是把分子相乘了。"}, {"type": "choice", "title": "减法", "question": "7/10 − 4/10 = ？", "options": ["3/10", "3/0", "3/20"], "answer": "3/10", "hint": "分母不变，分子 7 − 4 = 3。", "why": "3/0 把分母也减了——分母是「分成几份」，不能减。"}, {"type": "quiz", "title": "分子是几", "question": "4/9 + 3/9 的结果，分子是多少？", "answer": 7, "unit": "", "hint": "4 + 3 = 7，分母保持 9。", "why": "写 9 是把分母也加了。"}, {"type": "summary", "title": "记住这两句", "points": ["同分母相加减，分母不变，只算分子", "分子加起来超过分母，说明结果比 1 大"], "advice": "下一步会学异分母——那时候要先通分，把分母变成一样再算。"}]};CourseEngine.mount(window.__CONTENT);</script>
