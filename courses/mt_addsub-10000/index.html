<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万以内的加减法 · 学阶图谱课件</title>
<link rel="stylesheet" href="../../templates/base.css">
<style>
  /* 题库专用样式 */
  .stage { display: none; }
  .stage.active { display: block; animation: fade .22s ease; }

  .qhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .qhead h2 { margin: 0; }
  .qhead .tag { font-size: 11.5px; color: var(--dim); border: 1px solid var(--line);
    padding: 1px 8px; border-radius: 20px; white-space: nowrap; }

  .dots { display: flex; gap: 6px; margin: 14px 0 16px; }
  .dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .dots i.ok { background: var(--ok); }
  .dots i.bad { background: var(--bad); }

  .answer-row { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 16px 0 6px; }
  .answer-row input { width: 168px; }

  .options { display: grid; gap: 10px; margin: 16px 0; }
  .opt { padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; text-align: left;
    min-height: 52px; cursor: pointer; font-family: inherit; touch-action: manipulation; }
  .opt:hover { border-color: var(--accent); }
  .opt.right { border-color: var(--ok); background: rgba(74,222,128,.12); }
  .opt.wrong { border-color: var(--bad); background: rgba(248,113,113,.12); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .hintbox { font-size: 13.5px; color: var(--dim); min-height: 22px; }
  .hintbox b { color: var(--accent); }

  .score { font-size: 40px; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .score small { font-size: 15px; color: var(--dim); font-weight: 400; }

  .stuck { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 14px 0; }
  .stuck b { color: var(--accent); }
</style>
</head>
<body>
<header>
  <a class="back" href="../../viz/index.html#t=mt_addsub-10000">← 回到图谱</a>
  <span class="muted" style="margin-left:auto">数学 · 三年级 · 万以内的加减法</span>
</header>

<main>
  <div id="gnav"></div>

  <!-- 引入：竖式为什么这么写 -->
  <section class="stage active" id="intro">
    <h1>进位和退位，一个都不漏</h1>
    <p class="muted">万以内的加减法，难的不是算，是进位和退位。一题里碰上两次，就容易漏一次。</p>

    <div class="viz" id="demoViz"></div>
    <div class="viz-cap" id="demoCap">先看这一题：<b>345 + 278</b></div>

    <div class="card tip">
      <p style="margin:0 0 6px"><b>竖式的三条规矩</b></p>
      <p style="margin:0" class="muted">① 相同数位对齐（个位对个位）　② 从个位算起　③ 满十进一，进的 1 写在<strong>前一位的上方</strong></p>
    </div>

    <div class="toolbar">
      <button class="btn small" id="demoReplay">再看一遍进位</button>
    </div>

    <div class="stuck">
      <b>横式看不出错在哪</b>
      <p style="margin:6px 0 0" class="muted">横着写「345 + 278」，进位是心里的；竖着写，进位是纸上的。看到那个小 1，才知道自己漏了没有。</p>
    </div>
  </section>

  <!-- 练习 -->
  <section class="stage" id="quiz">
    <div class="dots" id="dots"></div>
    <div class="qhead">
      <h2 id="qLabel"></h2>
      <span class="tag" id="qTag"></span>
    </div>
    <div id="qViz"></div>
    <div class="viz-cap" id="qCap"></div>
    <div id="qBody"></div>
    <div id="feedback"></div>
    <div class="toolbar">
      <button class="btn small" id="hintBtn">看进位标记</button>
      <button class="btn small" id="checkBtn">对答案</button>
    </div>
    <div class="hintbox" id="whyBox"></div>
  </section>

  <!-- 结算 -->
  <section class="stage" id="summary">
    <h2>做完了</h2>
    <div class="card">
      <div class="score" id="scoreText">—</div>
      <p class="muted" style="margin:6px 0 0" id="timeText"></p>
      <p style="margin:10px 0 0" id="advice"></p>
    </div>
    <div id="extend"></div>
  </section>
</main>

<footer>
  <div class="progress">
    <span id="pnum">准备</span>
    <div class="bar"><i id="pbar"></i></div>
  </div>
  <button class="btn" id="prev">上一题</button>
  <button class="btn primary" id="next">开始练习</button>
</footer>

<script src="../../templates/renderers.js"></script>
<script>
(function () {
  'use strict';

  var TOPIC_ID = 'mt_addsub-10000';
  var COURSE_VERSION = '2.0.0';
  var startedAt = Date.now();

  /* ── 题库：a/b/op 直接给竖式用，expr 供校验器复算 ───────── */
  var QUIZ = [
    {
      id: 'q1', type: 'number', label: '先热身', tag: '一次进位',
      a: 345, b: 278, op: '+', answer: 623, expr: '345+278',
      hint: '个位 5+8=13，写 3，向十位进 1；十位 4+7+1=12，写 2，向百位进 1；百位 3+2+1=6。',
      why: '进位加的 1 要加进下一位，不是写在旁边就算完。'
    },
    {
      id: 'q2', type: 'number', label: '两次进位', tag: '连续进位',
      a: 907, b: 486, op: '+', answer: 1393, expr: '907+486',
      hint: '个位 7+6=13 进 1；十位 0+8+1=9，不进位；百位 9+4=13 进 1，千位写 1。',
      why: '这题最容易错在百位：9+4=13 已经满 10，可十位没进位，所以百位只进 1 位。'
    },
    {
      id: 'q3', type: 'number', label: '连着借两次', tag: '连续退位',
      a: 1000, b: 365, op: '-', answer: 635, expr: '1000-365',
      hint: '个位 0 不够减，向十位借；十位是 0，继续向百位借；百位也是 0，再向千位借 1 当 10。',
      why: '借位要一级一级借，借过的数不能又被借一次——先点上退位点再算。'
    },
    {
      id: 'q4', type: 'number', label: '两次都满十', tag: '诊断题',
      a: 745, b: 268, op: '+', answer: 1013, expr: '745+268',
      hint: '个位 5+8=13 进 1；十位 4+6+1=11 再进 1；百位 7+2+1=10，千位写 1。',
      why: '十位和百位都满 10，两个进位都要写；漏一个就差 100。'
    },
    {
      id: 'q5', type: 'choice', label: '不算竖式，估一估', tag: '估算',
      prompt: '907 + 486 大约是多少？',
      answer: '1400 左右',
      options: ['1100 左右', '1400 左右', '1800 左右'],
      hint: '907 看成 900，486 看成 500，合起来 1400。',
      why: '估算是检查工具：算完发现离估计太远，基本就是进位出了问题。'
    },
    {
      id: 'q6', type: 'number', label: '十位是 0 的退位', tag: '易错',
      a: 602, b: 378, op: '-', answer: 224, expr: '602-378',
      hint: '个位 2 不够减 8，向十位借；十位是 0，先从百位借 1 变成 10，再借给个位。',
      why: '十位是 0 时不能直接借，要先从百位借。这一步漏了，整题就崩。'
    }
  ];

  /* 校验器会读这段做复算 */
  window.__ANSWERS = [
    {"id":"q1","kind":"number","value":623,"expr":"345+278"},
    {"id":"q2","kind":"number","value":1393,"expr":"907+486"},
    {"id":"q3","kind":"number","value":635,"expr":"1000-365"},
    {"id":"q4","kind":"number","value":1013,"expr":"745+268"},
    {"id":"q5","kind":"choice","value":"1400 左右"},
    {"id":"q6","kind":"number","value":224,"expr":"602-378"}
  ];

  var $ = function (id) { return document.getElementById(id); };
  var idx = -1;                       // -1 = 引入页
  var state = QUIZ.map(function () { return { attempts: 0, solved: false, first: false }; });
  var firstTry = 0;
  var currentViz = null;

  /* ── 图谱位置条（数据来自构建时注入的 __GRAPH）─────────── */
  var G = window.__GRAPH || null;
  if (G && window.CR && CR.graphNav) {
    CR.graphNav($('gnav'), G);
  } else {
    $('gnav').style.display = 'none';
  }

  /* ── 引入页演示：345 + 278，先不给答案，只演示进位 ─────── */
  function demo() {
    if (!window.CR) return;
    $('demoViz').innerHTML = '';
    var v = CR.vertical($('demoViz'), { a: 345, b: 278, op: '+', carries: false });
    currentViz = v;
    var i = 0;
    (function step() {
      if (i > 3) {
        v.carries(true);
        $('demoCap').innerHTML = '三位都算完了。<b>两个小 1</b> 就是两次进位——漏掉任何一个，答案就错。';
        return;
      }
      v.reveal(i);
      i++;
      setTimeout(step, CR.reduced() ? 0 : 850);
    })();
  }
  $('demoReplay').onclick = demo;

  /* ── 题目渲染 ─────────────────────────────────────────── */
  var dotsEl = $('dots');
  QUIZ.forEach(function () { dotsEl.appendChild(document.createElement('i')); });
  var dotEls = [].slice.call(dotsEl.children);

  function renderDots() {
    dotEls.forEach(function (d, i) {
      d.className = i === idx ? 'on' : state[i].solved ? 'ok' : (state[i].attempts ? 'bad' : '');
    });
  }

  function updateBar() {
    var done = state.filter(function (s) { return s.solved; }).length;
    $('pbar').style.width = (done / QUIZ.length * 100) + '%';
    $('pnum').textContent = idx < 0 ? '准备' : '第 ' + (idx + 1) + ' / ' + QUIZ.length + ' 题';
  }

  function stage(name) {
    ['intro', 'quiz', 'summary'].forEach(function (k) {
      $(k).classList.toggle('active', k === name);
    });
  }

  function render() {
    var q = QUIZ[idx], st = state[idx];
    $('qLabel').textContent = q.label;
    $('qTag').textContent = q.tag || '';
    $('qViz').innerHTML = '';
    $('qViz').className = 'viz';
    currentViz = null;

    if (q.type === 'number') {
      currentViz = CR.vertical($('qViz'), { a: q.a, b: q.b, op: q.op, carries: false });
      $('qCap').innerHTML = '在竖式上算：<b>' + q.a + (q.op === '+' ? ' + ' : ' − ') + q.b + '</b>';
      $('qBody').innerHTML =
        '<div class="answer-row">' +
        '<input id="ans" type="number" inputmode="numeric" aria-label="输入答案" placeholder="填答案" value="' + (st.lastValue || '') + '">' +
        '</div>';
      $('ans').addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      if (!st.solved) setTimeout(function () { $('ans').focus(); }, 60);
    } else {
      $('qViz').className = '';
      $('qCap').innerHTML = '这题不用算，<b>估一估</b>';
      $('qBody').innerHTML =
        '<p style="font-size:17px;margin:14px 0">' + q.prompt + '</p>' +
        '<div class="options">' + q.options.map(function (o) {
          return '<button class="opt" data-val="' + o + '">' + o + '</button>';
        }).join('') + '</div>';
      [].slice.call(document.querySelectorAll('.opt')).forEach(function (b) {
        b.onclick = function () { pickChoice(b); };
      });
    }

    $('feedback').innerHTML = st.solved ? '<div class="card ok">这题已经答对了。</div>' : '';
    $('whyBox').innerHTML = st.attempts && !st.solved ? '<b>可能的错法：</b>' + q.why : '';
    $('hintBtn').style.display = (st.solved || q.type !== 'number') ? 'none' : '';
    $('hintBtn').disabled = false;
    $('hintBtn').textContent = '看进位标记';
    $('checkBtn').style.display = q.type === 'number' ? '' : 'none';
    $('checkBtn').disabled = st.solved;
    $('next').disabled = !st.solved && idx < QUIZ.length - 1;
    $('next').textContent = (idx >= QUIZ.length - 1 && st.solved) ? '完成' : '下一题';
    $('prev').disabled = idx <= 0;
    renderDots();
    updateBar();
  }

  function markSolved() {
    var st = state[idx];
    st.solved = true;
    st.first = st.attempts === 1;
    if (st.first) firstTry++;
  }

  function afterSolved(q) {
    if (currentViz) currentViz.carries(true).reveal(99);
    $('feedback').innerHTML = '<div class="card ok">对，答案是 <b>' + q.answer + '</b>。' + q.hint + '</div>';
    $('whyBox').innerHTML = '';
    var ansEl = $('ans');
    if (ansEl) { ansEl.value = q.answer; ansEl.readOnly = true; }
    $('hintBtn').style.display = 'none';
    $('checkBtn').style.display = 'none';
    $('next').disabled = false;
    $('next').textContent = idx >= QUIZ.length - 1 ? '完成' : '下一题';
    renderDots();
    updateBar();
  }

  function check() {
    var q = QUIZ[idx], st = state[idx];
    if (st.solved) return;
    var raw = $('ans').value.trim();
    if (raw === '') { $('feedback').innerHTML = '<div class="card tip">先填一个数。</div>'; return; }
    st.attempts++;
    st.lastValue = raw;
    if (Number(raw) === q.answer) {
      markSolved();
      afterSolved(q);
    } else {
      renderDots();
      $('feedback').innerHTML = '<div class="card pitfall">再想想。先把这一位的进位或退位标出来，再往下算。</div>';
      $('whyBox').innerHTML = '<b>可能的错法：</b>' + q.why;
      $('next').disabled = true;
    }
  }

  function pickChoice(btn) {
    var q = QUIZ[idx], st = state[idx];
    if (st.solved) return;
    st.attempts++;
    if (btn.dataset.val === q.answer) {
      btn.classList.add('right');
      markSolved();
      afterSolved(q);
    } else {
      btn.classList.add('wrong');
      renderDots();
      $('feedback').innerHTML = '<div class="card pitfall">不对。把两个数都往大一点估，再比一比。</div>';
      $('whyBox').innerHTML = '<b>提示：</b>' + q.hint;
    }
  }

  $('checkBtn').onclick = check;

  /* 看进位标记：只给脚手架，不给答案 */
  $('hintBtn').onclick = function () {
    var q = QUIZ[idx];
    if (!currentViz || q.type !== 'number') return;
    currentViz.carries(true);
    this.disabled = true;
    this.textContent = '已标出进位';
    $('feedback').innerHTML =
      '<div class="card tip">进位 / 退位已经标在竖式上方了。' +
      (q.op === '+' ? '那个小 1 要加进左边一位。' : '退位点表示这一位少了 1。') + '</div>';
  };

  function go(n) {
    idx = Math.max(0, Math.min(QUIZ.length - 1, n));
    stage('quiz');
    render();
  }

  $('prev').onclick = function () { if (idx > 0) go(idx - 1); };
  $('next').onclick = function () {
    if (idx < 0) { go(0); return; }
    if (idx >= QUIZ.length - 1) { finish(); return; }
    go(idx + 1);
  };

  /* ── 结算 ─────────────────────────────────────────────── */
  function finish() {
    var mins = Math.max(1, Math.round((Date.now() - startedAt) / 60000));
    $('scoreText').innerHTML = firstTry + ' / ' + QUIZ.length + ' <small>一次答对</small>';
    $('timeText').textContent = '用时约 ' + mins + ' 分钟';

    var advice;
    if (firstTry === QUIZ.length) {
      advice = '这个水平可以往下走了：乘除法会大量复用「满十进一」的思路。';
    } else if (firstTry >= QUIZ.length - 2) {
      advice = '基本稳了。错的题多半是进位没标，做题时先把小 1 写上去再算。';
    } else {
      advice = '建议把「看进位标记」用熟：每算一位就标一次，比事后检查有效。';
    }
    $('advice').textContent = advice;

    try {
      localStorage.setItem('stx.course.' + TOPIC_ID, JSON.stringify({
        done: true, score: firstTry / QUIZ.length, minutes: mins, at: Date.now(), v: COURSE_VERSION
      }));
    } catch (e) { /* 隐私模式忽略 */ }

    stage('summary');
    if (G && window.CR && CR.extend) {
      CR.extend($('extend'), G, { score: firstTry + '/' + QUIZ.length });
    }

    $('next').textContent = '返回图谱…';
    $('next').disabled = true;
    // ?stay=1 用于本地预览：停在结算页，不自动跳回图谱
    if (new URLSearchParams(location.search).get('stay') === '1') return;
    var sc = new URLSearchParams(location.search).get('sharecode');
    setTimeout(function () {
      var q = new URLSearchParams();
      if (sc) q.set('sharecode', sc);
      q.set('done', '1');
      q.set('score', firstTry + '/' + QUIZ.length);
      q.set('minutes', String(mins));
      location.href = '../../viz/index.html?' + q.toString() + '#t=' + TOPIC_ID;
    }, 900);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' && $('next').disabled === false) $('next').click();
    if (e.key === 'ArrowLeft' && $('prev').disabled === false) $('prev').click();
  });

  /* 线上分享链接用 ?sharecode= 鉴权，回跳时带上 */
  (function () {
    var sc = new URLSearchParams(location.search).get('sharecode');
    if (!sc) return;
    [].slice.call(document.querySelectorAll('a[href*="index.html"]')).forEach(function (a) {
      var href = a.getAttribute('href');
      if (href.indexOf('sharecode=') >= 0) return;
      var i = href.indexOf('#');
      var base = i >= 0 ? href.slice(0, i) : href;
      var tail = i >= 0 ? href.slice(i) : '';
      a.setAttribute('href', base + '?sharecode=' + encodeURIComponent(sc) + tail);
    });
  })();

  demo();
  stage('intro');
  updateBar();
})();
</script>
</body>
</html>
